server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Prevent nginx from inserting :3000 into self-issued redirects
    absolute_redirect off;

    # ── Proxy headers shared across all proxy locations ────────────────────────
    proxy_ssl_server_name on;
    proxy_ssl_name        fishcareai-species-app-b1e198.anysites.app;
    proxy_set_header      Host              fishcareai-species-app-b1e198.anysites.app;
    proxy_set_header      X-Real-IP         $remote_addr;
    proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Host  $host;
    proxy_set_header      X-Forwarded-Proto https;
    proxy_set_header      X-Forwarded-Port  443;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;
    proxy_connect_timeout 15s;
    proxy_buffering       off;
    # Rewrite upstream Location headers that reference the anysites origin
    proxy_redirect https://fishcareai-species-app-b1e198.anysites.app/ https://www.fishcareai.com/;
    proxy_redirect https://fishcareai-species-app-b1e198.anysites.app  https://www.fishcareai.com;

    # ── Canonical host: non-www → www (SEO, consolidates homepage authority) ──
    # Runs before every location block so it applies site-wide. $request_uri
    # keeps the full path and query string. Safe use of `if` (return only).
    if ($host = fishcareai.com) {
        return 301 https://www.fishcareai.com$request_uri;
    }

    # ── Next.js static chunks ──────────────────────────────────────────────────
    location ^~ /_next/ {
        proxy_pass https://fishcareai-species-app-b1e198.anysites.app;
    }

    # ── /species trailing slash → canonical ───────────────────────────────────
    # Must be defined before the proxy locations because exact-match (=) is
    # tested first, then the regex redirect fires before the proxy regex.
    location = /species/ {
        return 301 /species$is_args$args;
    }
    # Legacy hub URL → canonical Fish Health hub.
    # Species-specific legacy disease URLs remain unchanged.
    location = /aquarium-fish-diseases {
        return 301 /fish-health/;
    }
    location = /aquarium-fish-diseases/ {
        return 301 /fish-health/;
    }
    # Deep paths with trailing slash (e.g. /fish-health/betta-not-eating/ → no slash)
    location ~ ^/(species|fish-health)/(.+)/$ {
        return 301 /$1/$2$is_args$args;
    }

    # ── Static overrides inside the proxied /fish-health namespace ─────────────
    # These pages are pre-rendered HTML in this repo instead of being rendered
    # per-request from the database by the species app. Exact-match (=) blocks
    # are evaluated before the regex proxy locations below, so they win.
    # The trailing-slash regex above still 301s /…/ to the canonical no-slash URL.
    location = /fish-health/celestial-pearl-danio-black-spots {
        try_files /fish-health/celestial-pearl-danio-black-spots/index.html =404;
    }

    # ── Proxy: Species App ─────────────────────────────────────────────────────
    # After the trailing-slash redirects above, all remaining /species and
    # /fish-health requests reach these proxy locations without a trailing slash.
    location ~ ^/species(/|$) {
        proxy_pass https://fishcareai-species-app-b1e198.anysites.app;
    }
    location ~ ^/fish-health(/|$) {
        proxy_pass https://fishcareai-species-app-b1e198.anysites.app;
    }

    # ── Redirects: /wiki index and /encyclopedia → /species ───────────────────
    location = /wiki      { return 301 /species; }
    location = /wiki/     { return 301 /species; }
    location = /encyclopedia  { return 301 /species; }
    location = /encyclopedia/ { return 301 /species; }

    # ── Redirects: individual wiki slugs → /species/<slug> ────────────────────
    location = /wiki/black-skirt-tetra/           { return 301 /species/black-skirt-tetra; }
    location = /wiki/bristlenose-pleco/           { return 301 /species/bristlenose-pleco; }
    location = /wiki/cardinal-tetra/              { return 301 /species/cardinal-tetra; }
    location = /wiki/clown-loach/                 { return 301 /species/clown-loach; }
    location = /wiki/dwarf-gourami/               { return 301 /species/dwarf-gourami; }
    location = /wiki/german-blue-ram/             { return 301 /species/german-blue-ram; }
    location = /wiki/jack-dempsey/                { return 301 /species/jack-dempsey; }
    location = /wiki/kribensis/                   { return 301 /species/kribensis; }
    location = /wiki/neon-tetra/                  { return 301 /species/neon-tetra; }
    location = /wiki/platy/                       { return 301 /species/platy; }
    location = /wiki/clownfish/                   { return 301 /species/ocellaris-clownfish; }
    location = /wiki/corydoras/                   { return 301 /species/bronze-cory; }
    location = /wiki/bala-shark/                  { return 301 /species/bala-shark; }
    location = /wiki/blood-parrot-cichlid/        { return 301 /species/blood-parrot-cichlid; }
    location = /wiki/celestial-pearl-danio/       { return 301 /species/celestial-pearl-danio; }
    location = /wiki/cherry-barb/                 { return 301 /species/cherry-barb; }
    location = /wiki/convict-cichlid/             { return 301 /species/convict-cichlid; }
    location = /wiki/endlers-livebearer/          { return 301 /species/endlers-livebearer; }
    location = /wiki/firemouth-cichlid/           { return 301 /species/firemouth-cichlid; }
    location = /wiki/flowerhorn-cichlid/          { return 301 /species/flowerhorn-cichlid; }
    location = /wiki/harlequin-rasbora/           { return 301 /species/harlequin-rasbora; }
    location = /wiki/kuhli-loach/                 { return 301 /species/kuhli-loach; }
    location = /wiki/moorish-idol/                { return 301 /species/moorish-idol; }
    location = /wiki/otocinclus/                  { return 301 /species/otocinclus; }
    location = /wiki/pearl-gourami/               { return 301 /species/pearl-gourami; }
    location = /wiki/pictus-catfish/              { return 301 /species/pictus-catfish; }
    location = /wiki/rainbow-shark/               { return 301 /species/rainbow-shark; }
    location = /wiki/rummy-nose-tetra/            { return 301 /species/rummy-nose-tetra; }
    location = /wiki/tiger-barb/                  { return 301 /species/tiger-barb; }
    location = /wiki/white-cloud-mountain-minnow/ { return 301 /species/white-cloud-mountain-minnow; }
    location = /wiki/rainbow-fish/                { return 301 /species/rainbow-fish; }

    # ── Redirects: wiki guide pages → /guides/ ────────────────────────────────
    location = /wiki/betta-fish/   { return 301 /guides/betta-fish-care/; }
    location = /wiki/goldfish/     { return 301 /guides/goldfish-care/; }
    location = /wiki/guppy/        { return 301 /guides/guppy-fish-care/; }
    location = /wiki/angelfish/    { return 301 /guides/angelfish-care/; }
    location = /wiki/molly/        { return 301 /guides/molly-fish-care/; }
    location = /wiki/oscar/        { return 301 /guides/oscar-fish-care/; }
    location = /wiki/zebra-danio/  { return 301 /guides/zebra-danio-fish-care/; }
    location = /wiki/discus/       { return 301 /guides/discus-fish-care-requirements/; }
    location = /wiki/swordtail/    { return 301 /guides/swordtail-fish-care-and-breeding/; }
    location = /wiki/koi/          { return 301 /guides/koi-fish-care/; }

    # retired wiki species pages → species app
    location = /wiki/african-butterfly-fish/ { return 301 /species/african-butterfly-fish; }
    location = /wiki/black-ghost-knifefish/ { return 301 /species/black-ghost-knifefish; }
    location = /wiki/black-neon-tetra/ { return 301 /species/black-neon-tetra; }
    location = /wiki/black-phantom-tetra/ { return 301 /species/black-phantom-tetra; }
    location = /wiki/black-ruby-barb/ { return 301 /species/black-ruby-barb; }
    location = /wiki/blue-tang/ { return 301 /species/blue-tang; }
    location = /wiki/bolivian-ram/ { return 301 /species/bolivian-ram; }
    location = /wiki/bosemans-rainbowfish/ { return 301 /species/bosemans-rainbowfish; }
    location = /wiki/clown-knifefish/ { return 301 /species/clown-knifefish; }
    location = /wiki/clown-pleco/ { return 301 /species/clown-pleco; }
    location = /wiki/congo-tetra/ { return 301 /species/congo-tetra; }
    location = /wiki/coral-beauty/ { return 301 /species/coral-beauty; }
    location = /wiki/denison-barb/ { return 301 /species/denison-barb; }
    location = /wiki/diamond-tetra/ { return 301 /species/diamond-tetra; }
    location = /wiki/dwarf-chain-loach/ { return 301 /species/dwarf-chain-loach; }
    location = /wiki/electric-yellow-cichlid/ { return 301 /species/electric-yellow-cichlid; }
    location = /wiki/fire-eel/ { return 301 /species/fire-eel; }
    location = /wiki/firefish-goby/ { return 301 /species/firefish-goby; }
    location = /wiki/flame-angelfish/ { return 301 /species/flame-angelfish; }
    location = /wiki/foxface-rabbitfish/ { return 301 /species/foxface-rabbitfish; }
    location = /wiki/frontosa-cichlid/ { return 301 /species/frontosa-cichlid; }
    location = /wiki/giant-danio/ { return 301 /species/giant-danio; }
    location = /wiki/glass-catfish/ { return 301 /species/glass-catfish; }
    location = /wiki/glowlight-danio/ { return 301 /species/glowlight-danio; }
    location = /wiki/glowlight-tetra/ { return 301 /species/glowlight-tetra; }
    location = /wiki/green-terror-cichlid/ { return 301 /species/green-terror-cichlid; }
    location = /wiki/hillstream-loach/ { return 301 /species/hillstream-loach; }
    location = /wiki/jewel-cichlid/ { return 301 /species/jewel-cichlid; }
    location = /wiki/julii-cory/ { return 301 /species/julii-cory; }
    location = /wiki/keyhole-cichlid/ { return 301 /species/keyhole-cichlid; }
    location = /wiki/lemon-tetra/ { return 301 /species/lemon-tetra; }
    location = /wiki/lionfish/ { return 301 /species/lionfish; }
    location = /wiki/moonlight-gourami/ { return 301 /species/moonlight-gourami; }
    location = /wiki/neon-rainbowfish/ { return 301 /species/neon-rainbowfish; }
    location = /wiki/pajama-cardinalfish/ { return 301 /species/pajama-cardinalfish; }
    location = /wiki/panda-cory/ { return 301 /species/panda-cory; }
    location = /wiki/peacock-cichlid/ { return 301 /species/peacock-cichlid; }
    location = /wiki/pearl-danio/ { return 301 /species/pearl-danio; }
    location = /wiki/peppered-cory/ { return 301 /species/peppered-cory; }
    location = /wiki/percula-clownfish/ { return 301 /species/percula-clownfish; }
    location = /wiki/red-eye-tetra/ { return 301 /species/red-eye-tetra; }
    location = /wiki/rosy-barb/ { return 301 /species/rosy-barb; }
    location = /wiki/royal-gramma/ { return 301 /species/royal-gramma; }
    location = /wiki/senegal-bichir/ { return 301 /species/senegal-bichir; }
    location = /wiki/serpae-tetra/ { return 301 /species/serpae-tetra; }
    location = /wiki/severum-cichlid/ { return 301 /species/severum-cichlid; }
    location = /wiki/silver-arowana/ { return 301 /species/silver-arowana; }
    location = /wiki/silver-dollar/ { return 301 /species/silver-dollar; }
    location = /wiki/sparkling-gourami/ { return 301 /species/sparkling-gourami; }
    location = /wiki/sterbai-cory/ { return 301 /species/sterbai-cory; }
    location = /wiki/texas-cichlid/ { return 301 /species/texas-cichlid; }
    location = /wiki/threadfin-rainbowfish/ { return 301 /species/threadfin-rainbowfish; }
    location = /wiki/three-spot-gourami/ { return 301 /species/three-spot-gourami; }
    location = /wiki/watchman-goby/ { return 301 /species/watchman-goby; }
    location = /wiki/weather-loach/ { return 301 /species/weather-loach; }
    location = /wiki/x-ray-tetra/ { return 301 /species/x-ray-tetra; }
    location = /wiki/yellow-tang/ { return 301 /species/yellow-tang; }
    location = /wiki/yoyo-loach/ { return 301 /species/yoyo-loach; }
    location = /wiki/zebra-loach/ { return 301 /species/zebra-loach; }
    location = /wiki/zebra-pleco/ { return 301 /species/zebra-pleco; }

    # ── Tool consolidation: duplicate size calculators ────────────────────────
    # /tools/tank-size-calculator/ and /tools/aquarium-size-calculator/ shipped
    # identical bodies (only TDK differed) and were splitting the same query
    # set. aquarium-size-calculator is the surviving canonical URL.
    location = /tools/tank-size-calculator  { return 301 /tools/aquarium-size-calculator/; }
    location = /tools/tank-size-calculator/ { return 301 /tools/aquarium-size-calculator/; }

    # discus cluster: parent path has no page of its own
    location = /guides/discus-fish-care/ { return 301 /guides/discus-fish-care-requirements/; }

    # ── Static files ───────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
