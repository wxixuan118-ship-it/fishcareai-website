server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # 避免 nginx 在 301 里加上 :3000 端口
    absolute_redirect off;

    # ── Proxy species-app (AnySites) ───────────────────────────────────────────
    location ~ ^/species(/|$) {
        proxy_pass https://fishcareai-species-app-b1e198.anysites.app;
        proxy_set_header Host fishcareai-species-app-b1e198.anysites.app;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/fish-health(/|$) {
        proxy_pass https://fishcareai-species-app-b1e198.anysites.app;
        proxy_set_header Host fishcareai-species-app-b1e198.anysites.app;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/ {
        proxy_pass https://fishcareai-species-app-b1e198.anysites.app/_next/;
        proxy_set_header Host fishcareai-species-app-b1e198.anysites.app;
        proxy_ssl_server_name on;
    }

    # ── Redirects: /wiki/ index and /encyclopedia → /species/ ─────────────────
    location = /wiki      { return 301 /species/; }
    location = /wiki/     { return 301 /species/; }
    location = /encyclopedia  { return 301 /species/; }
    location = /encyclopedia/ { return 301 /species/; }

    # ── Redirects: individual wiki slugs → /species/ ──────────────────────────
    location = /wiki/black-skirt-tetra/     { return 301 /species/black-skirt-tetra; }
    location = /wiki/bristlenose-pleco/     { return 301 /species/bristlenose-pleco; }
    location = /wiki/cardinal-tetra/        { return 301 /species/cardinal-tetra; }
    location = /wiki/clown-loach/           { return 301 /species/clown-loach; }
    location = /wiki/dwarf-gourami/         { return 301 /species/dwarf-gourami; }
    location = /wiki/german-blue-ram/       { return 301 /species/german-blue-ram; }
    location = /wiki/jack-dempsey/          { return 301 /species/jack-dempsey; }
    location = /wiki/kribensis/             { return 301 /species/kribensis; }
    location = /wiki/neon-tetra/            { return 301 /species/neon-tetra; }
    location = /wiki/platy/                 { return 301 /species/platy; }
    location = /wiki/clownfish/             { return 301 /species/ocellaris-clownfish; }
    location = /wiki/corydoras/             { return 301 /species/bronze-cory; }
    location = /wiki/bala-shark/            { return 301 /species/bala-shark; }
    location = /wiki/blood-parrot-cichlid/  { return 301 /species/blood-parrot-cichlid; }
    location = /wiki/celestial-pearl-danio/ { return 301 /species/celestial-pearl-danio; }
    location = /wiki/cherry-barb/           { return 301 /species/cherry-barb; }
    location = /wiki/convict-cichlid/       { return 301 /species/convict-cichlid; }
    location = /wiki/endlers-livebearer/    { return 301 /species/endlers-livebearer; }
    location = /wiki/firemouth-cichlid/     { return 301 /species/firemouth-cichlid; }
    location = /wiki/flowerhorn-cichlid/    { return 301 /species/flowerhorn-cichlid; }
    location = /wiki/harlequin-rasbora/     { return 301 /species/harlequin-rasbora; }
    location = /wiki/kuhli-loach/           { return 301 /species/kuhli-loach; }
    location = /wiki/moorish-idol/          { return 301 /species/moorish-idol; }
    location = /wiki/otocinclus/            { return 301 /species/otocinclus; }
    location = /wiki/pearl-gourami/         { return 301 /species/pearl-gourami; }
    location = /wiki/pictus-catfish/        { return 301 /species/pictus-catfish; }
    location = /wiki/rainbow-shark/         { return 301 /species/rainbow-shark; }
    location = /wiki/rummy-nose-tetra/      { return 301 /species/rummy-nose-tetra; }
    location = /wiki/tiger-barb/            { return 301 /species/tiger-barb; }
    location = /wiki/white-cloud-mountain-minnow/ { return 301 /species/white-cloud-mountain-minnow; }
    location = /wiki/rainbow-fish/          { return 301 /species/rainbow-fish; }

    # ── Redirects: wiki guide pages → /guides/ ────────────────────────────────
    location = /wiki/betta-fish/   { return 301 /guides/betta-fish-care/; }
    location = /wiki/goldfish/     { return 301 /guides/goldfish-care/; }
    location = /wiki/guppy/        { return 301 /guides/guppy-fish-care/; }
    location = /wiki/angelfish/    { return 301 /guides/angelfish-care/; }
    location = /wiki/molly/        { return 301 /guides/molly-fish-care/; }
    location = /wiki/oscar/        { return 301 /guides/oscar-fish-care/; }
    location = /wiki/zebra-danio/  { return 301 /guides/zebra-danio-fish-care/; }
    location = /wiki/discus/       { return 301 /guides/discus-fish-care-requirements/; }
    location = /wiki/swordtail/    { return 301 /guides/swordtail-fish-care-and-breeding/; }
    location = /wiki/koi/          { return 301 /guides/koi-fish-care/; }

    # ── Static files ───────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
