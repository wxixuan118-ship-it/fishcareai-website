[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep one canonical host and protocol. These rules must remain before
# path-level redirects and the final custom 404 rule.
[[redirects]]
  from = "http://fishcareai.com/*"
  to = "https://www.fishcareai.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.fishcareai.com/*"
  to = "https://www.fishcareai.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://fishcareai.com/*"
  to = "https://www.fishcareai.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/encyclopedia/"
  to = "/wiki/"
  status = 301

