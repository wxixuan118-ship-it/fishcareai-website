[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/partners/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/thank-you/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Keep one canonical host and protocol. These rules must remain before
# path-level redirects and the final custom 404 rule.
[[redirects]]
  from = "http://fishcareai.com/*"
  to = "https://www.fishcareai.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.fishcareai.com/*"
  to = "https://www.fishcareai.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://fishcareai.com/*"
  to = "https://www.fishcareai.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/encyclopedia/"
  to = "/wiki/"
  status = 301

# wiki species-profile pages now serve their own content (index,follow + canonical to self).
# Removed: /wiki/{fish}/ → /guides/{fish}/ redirects that were killing wiki indexation.

[[redirects]]
  from = "/guides/guppies/"
  to = "/guides/guppy-fish-care/"
  status = 301
  force = true

[[redirects]]
  from = "/guides/betta-care-guide/"
  to = "/guides/betta-fish-care/"
  status = 301
  force = true

[[redirects]]
  from = "/guides/guppy-care-guide/"
  to = "/guides/guppy-fish-care/"
  status = 301
  force = true

[[redirects]]
  from = "/guides/goldfish-care-guide/"
  to = "/guides/goldfish-care/"
  status = 301
  force = true

[[redirects]]
  from = "/guides/discus-care-guide/"
  to = "/guides/discus-fish-care-requirements/"
  status = 301
  force = true

[[redirects]]
  from = "/guides/angelfish-care-guide/"
  to = "/guides/angelfish-care/"
  status = 301
  force = true

[[redirects]]
  from = "/guides/swordtail-care-guide/"
  to = "/guides/swordtail-fish-care-and-breeding/"
  status = 301
  force = true

[[redirects]]
  from = "/guides/molly-care-guide/"
  to = "/guides/molly-fish-care/"
  status = 301
  force = true

[[redirects]]
  from = "/guides/oscar-care-guide/"
  to = "/guides/oscar-fish-care/"
  status = 301
  force = true

[[redirects]]
  from = "/FishCare.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/guides/petco-fish-care/"
  to = "/guides/"
  status = 301
  force = true

# ── Species Module (Phase 2) ──────────────────────────────────────────────────
# Species that already have care guides on main site → redirect to existing pages
# Add more entries here as new species with existing guides are identified.
[[redirects]]
  from = "/species/betta-fish/care-guide"
  to = "/guides/betta-fish-care/"
  status = 301
  force = true

[[redirects]]
  from = "/species/betta-fish/care-guide/"
  to = "/guides/betta-fish-care/"
  status = 301
  force = true

# All other /species/* → proxy to Next.js species app on Vercel
[[redirects]]
  from = "/species/*"
  to = "https://fishcareai-species.vercel.app/species/:splat"
  status = 200
  force = true

# ── Catch-all (keep last) ─────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
