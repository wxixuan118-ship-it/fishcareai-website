<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">Aquarium water parameters: safe, caution, act</title><desc id="desc">Five banded gauges for a typical freshwater community tank. Ammonia and nitrite are safe only at 0 ppm. Nitrate is safe under 20 ppm, caution 20 to 40, act above 40. pH is safe between 6.5 and 7.8. Temperature is safe between 74 and 80 degrees Fahrenheit. Species requirements vary.</desc>
<rect width="900" height="620" rx="18" fill="#EFF7FD"/><path d="M18 0H882Q900 0 900 18V98H0V18Q0 0 18 0" fill="#12507C"/>
<g font-family="Segoe UI,Helvetica,Arial,sans-serif">
<text x="32" y="44" font-size="29" font-weight="700" fill="white">Water parameters: safe, caution, act</text>
<text x="32" y="76" font-size="18" fill="#DAEEFF">Typical freshwater community ranges — species requirements vary</text>

<g transform="translate(28,120)">
<rect width="844" height="464" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#0F3D5E">What each reading means</text>
<g><rect x="520" y="22" width="14" height="14" rx="3" fill="#237C62"/><text x="540" y="34" font-size="13" fill="#36566D">Safe</text><rect x="592" y="22" width="14" height="14" rx="3" fill="#B8791A"/><text x="612" y="34" font-size="13" fill="#36566D">Caution</text><rect x="684" y="22" width="14" height="14" rx="3" fill="#C0392B"/><text x="704" y="34" font-size="13" fill="#36566D">Act now</text></g>

<g font-size="17" font-weight="700" fill="#0F3D5E"><text x="24" y="88">Ammonia</text><text x="24" y="164">Nitrite</text><text x="24" y="240">Nitrate</text><text x="24" y="316">pH</text><text x="24" y="392">Temperature</text></g>
<g font-size="13" fill="#36566D"><text x="24" y="108">NH₃ / NH₄⁺</text><text x="24" y="184">NO₂⁻</text><text x="24" y="260">NO₃⁻</text><text x="24" y="336">buffered by KH</text><text x="24" y="412">tropical community</text></g>

<g font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<rect x="190" y="72" width="199" height="26" fill="#237C62"/><text x="289" y="89">0 ppm</text>
<rect x="390" y="72" width="199" height="26" fill="#B8791A"/><text x="489" y="89">0.02–0.25 ppm</text>
<rect x="590" y="72" width="210" height="26" fill="#C0392B"/><text x="695" y="89">&gt; 0.25 ppm</text>

<rect x="190" y="148" width="199" height="26" fill="#237C62"/><text x="289" y="165">0 ppm</text>
<rect x="390" y="148" width="199" height="26" fill="#B8791A"/><text x="489" y="165">0.1–0.5 ppm</text>
<rect x="590" y="148" width="210" height="26" fill="#C0392B"/><text x="695" y="165">&gt; 0.5 ppm</text>

<rect x="190" y="224" width="199" height="26" fill="#237C62"/><text x="289" y="241">&lt; 20 ppm</text>
<rect x="390" y="224" width="199" height="26" fill="#B8791A"/><text x="489" y="241">20–40 ppm</text>
<rect x="590" y="224" width="210" height="26" fill="#C0392B"/><text x="695" y="241">&gt; 40 ppm</text>

<rect x="190" y="300" width="89" height="26" fill="#C0392B"/><text x="234" y="317">&lt; 6.0</text>
<rect x="280" y="300" width="79" height="26" fill="#B8791A"/><text x="319" y="317">6.0–6.5</text>
<rect x="360" y="300" width="199" height="26" fill="#237C62"/><text x="459" y="317">6.5–7.8</text>
<rect x="560" y="300" width="79" height="26" fill="#B8791A"/><text x="599" y="317">7.8–8.4</text>
<rect x="640" y="300" width="160" height="26" fill="#C0392B"/><text x="720" y="317">&gt; 8.4</text>

<rect x="190" y="376" width="179" height="26" fill="#2E84C0"/><text x="279" y="393">&lt; 74°F</text>
<rect x="370" y="376" width="249" height="26" fill="#237C62"/><text x="494" y="393">74–80°F</text>
<rect x="620" y="376" width="180" height="26" fill="#B8791A"/><text x="710" y="393">&gt; 80°F</text>
</g>

<g font-size="13" fill="#36566D"><text x="190" y="122">Toxic at any reading. Higher pH makes more of it the toxic free-ammonia form.</text><text x="190" y="198">Blocks oxygen transport in the blood. Water change as soon as it registers.</text><text x="190" y="274">Controlled by weekly water changes and live plants.</text><text x="190" y="350">A steady value matters more than a perfect one. KH is the buffer that holds it.</text><text x="190" y="426">Set the heater to the species you keep, not to the middle of this band.</text></g>
</g>

<text x="450" y="608" text-anchor="middle" font-size="15" fill="#36566D">Bands are categorical, not a linear scale. Always follow the requirements of the species you keep.</text>
</g></svg>
