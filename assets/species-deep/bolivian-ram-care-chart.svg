<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Bolivian ram care chart: 40-gallon minimum tank, 75–82 °F, pH 6.0–7.5, adult size about 3 inches">
<rect width="1200" height="600" rx="24" fill="#0D2741"/>
<rect x="1" y="1" width="1198" height="598" rx="24" fill="none" stroke="#1A3A5C" stroke-width="2"/>
<g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="60" y="78" font-size="38" font-weight="700" fill="#ffffff">Bolivian Ram care at a glance</text>
<text x="60" y="114" font-size="22" fill="#7AAABE" font-style="italic">Mikrogeophagus altispinosus</text>
<text x="60" y="178" font-size="24" font-weight="600" fill="#D8EAF5">Minimum tank</text>
<text x="60" y="210" font-size="21" fill="#7AAABE">40 US gal (151 L)</text>
<rect x="360" y="160" width="760" height="26" rx="13" fill="#07192D"/>
