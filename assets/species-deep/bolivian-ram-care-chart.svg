<text x="60" y="270" font-size="24" font-weight="600" fill="#D8EAF5">Temperature</text>
<text x="60" y="302" font-size="21" fill="#7AAABE">75–82 °F</text>
<rect x="360" y="252" width="760" height="26" rx="13" fill="#07192D"/>
<rect x="835.0" y="252" width="133.0" height="26" rx="13" fill="#F5A623"/>
<text x="360" y="304" font-size="17" fill="#7AAABE">50 °F</text>
<text x="1120" y="304" font-size="17" fill="#7AAABE" text-anchor="end">90 °F</text>
<text x="60" y="362" font-size="24" font-weight="600" fill="#D8EAF5">pH</text>
<text x="60" y="394" font-size="21" fill="#7AAABE">6.0–7.5</text>
<rect x="360" y="344" width="760" height="26" rx="13" fill="#07192D"/>
