<text x="360" y="396" font-size="17" fill="#7AAABE">5.0</text>
<text x="1120" y="396" font-size="17" fill="#7AAABE" text-anchor="end">9.0</text>
<text x="60" y="454" font-size="24" font-weight="600" fill="#D8EAF5">Adult size</text>
<text x="60" y="486" font-size="21" fill="#7AAABE">3.1 in (8 cm)</text>
<rect x="360" y="436" width="760" height="26" rx="13" fill="#07192D"/>
