<text x="360" y="488" font-size="17" fill="#7AAABE">0</text>
<text x="1120" y="488" font-size="17" fill="#7AAABE" text-anchor="end">12 in</text>
<text x="60" y="544" font-size="22" fill="#D8EAF5"><tspan font-weight="600">Group:</tspan> Single fish, a bonded pair, or 6–8 in a 4-ft tank</text>
<text x="60" y="580" font-size="22" fill="#D8EAF5"><tspan font-weight="600">Care level:</tspan> Moderate — needs a mature, stable tank</text>
<text x="1140" y="568" font-size="17" fill="#7AAABE" text-anchor="end">fishcareai.com</text>
