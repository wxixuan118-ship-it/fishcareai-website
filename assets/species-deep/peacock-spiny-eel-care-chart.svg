<text x="60" y="544" font-size="22" fill="#D8EAF5"><tspan font-weight="600">Group:</tspan> Singly, or groups in a large footprint</text>
<text x="60" y="580" font-size="22" fill="#D8EAF5"><tspan font-weight="600">Care level:</tspan> Moderate — sand, a sealed lid, frozen food</text>
<text x="1140" y="568" font-size="17" fill="#7AAABE" text-anchor="end">fishcareai.com</text>
