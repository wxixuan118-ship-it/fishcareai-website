<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Peacock spiny eel care chart: 55-gallon tank for adults, 75–82 °F, pH 6.0–7.0, adult size about 12 inches">
