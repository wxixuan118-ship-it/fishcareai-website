<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" role="img" aria-labelledby="title desc"><title id="title">Your first aquarium: 8 steps</title><desc id="desc">Follow steps 1 through 8 in order. Install equipment before filling, confirm a fishless cycle with tests before stocking, then monitor water quality.</desc><rect width="900" height="820" rx="18" fill="#EFF7FD"/><path d="M18 0H882Q900 0 900 18V98H0V18Q0 0 18 0" fill="#12507C"/><g font-family="Segoe UI,Helvetica,Arial,sans-serif"><text x="32" y="44" font-size="29" font-weight="700" fill="white">Your first aquarium: 8 steps</text><text x="32" y="76" font-size="18" fill="#DAEEFF">Build first → cycle and test → add fish gradually → maintain</text><rect x="28" y="118" width="844" height="67" rx="12" fill="white" stroke="#C9DFED"/><circle cx="62" cy="151" r="22" fill="#12507C"/><text x="62" y="159" text-anchor="middle" font-size="23" font-weight="700" fill="white">1</text><text x="104" y="145" font-size="21" font-weight="700" fill="#12507C">Choose tank + stand</text><text x="104" y="169" font-size="18" fill="#36566D">Match adult fish needs; use a level, load-rated stand.</text><path d="M62 187v9m-4-4 4 4 4-4" fill="none" stroke="#597D96" stroke-width="2"/><rect x="28" y="199" width="844" height="67" rx="12" fill="white" stroke="#C9DFED"/><circle cx="62" cy="232" r="22" fill="#12507C"/><text x="62" y="240" text-anchor="middle" font-size="23" font-weight="700" fill="white">2</text><text x="104" y="226" font-size="21" font-weight="700" fill="#12507C">Rinse tank + substrate</text><text x="104" y="250" font-size="18" fill="#36566D">Use clean water without soap.</text><path d="M62 268v9m-4-4 4 4 4-4" fill="none" stroke="#597D96" stroke-width="2"/><rect x="28" y="280" width="844" height="67" rx="12" fill="white" stroke="#C9DFED"/><circle cx="62" cy="313" r="22" fill="#12507C"/><text x="62" y="321" text-anchor="middle" font-size="23" font-weight="700" fill="white">3</text><text x="104" y="307" font-size="21" font-weight="700" fill="#12507C">Install filter + heater</text><text x="104" y="331" font-size="18" fill="#36566D">Add a thermometer. Keep equipment unplugged.</text><path d="M62 349v9m-4-4 4 4 4-4" fill="none" stroke="#597D96" stroke-width="2"/><rect x="28" y="361" width="844" height="67" rx="12" fill="white" stroke="#C9DFED"/><circle cx="62" cy="394" r="22" fill="#12507C"/><text x="62" y="402" text-anchor="middle" font-size="23" font-weight="700" fill="white">4</text><text x="104" y="388" font-size="21" font-weight="700" fill="#12507C">Add plants + hiding places</text><text x="104" y="412" font-size="18" fill="#36566D">Arrange aquarium-safe decor before filling.</text><path d="M62 430v9m-4-4 4 4 4-4" fill="none" stroke="#597D96" stroke-width="2"/><rect x="28" y="442" width="844" height="67" rx="12" fill="white" stroke="#C9DFED"/><circle cx="62" cy="475" r="22" fill="#12507C"/><text x="62" y="483" text-anchor="middle" font-size="23" font-weight="700" fill="white">5</text><text x="104" y="469" font-size="21" font-weight="700" fill="#12507C">Fill with treated water</text><text x="104" y="493" font-size="18" fill="#36566D">Dechlorinate, make drip loops, then start equipment.</text><path d="M62 511v9m-4-4 4 4 4-4" fill="none" stroke="#597D96" stroke-width="2"/><rect x="28" y="523" width="844" height="67" rx="12" fill="white" stroke="#C9DFED"/><circle cx="62" cy="556" r="22" fill="#237C62"/><text x="62" y="564" text-anchor="middle" font-size="23" font-weight="700" fill="white">6</text><text x="104" y="550" font-size="21" font-weight="700" fill="#237C62">Cycle the tank — no fish yet</text><text x="104" y="574" font-size="18" fill="#36566D">Test a measured ammonia input; verify zero ammonia and nitrite.</text><path d="M62 592v9m-4-4 4 4 4-4" fill="none" stroke="#597D96" stroke-width="2"/><rect x="28" y="604" width="844" height="67" rx="12" fill="white" stroke="#C9DFED"/><circle cx="62" cy="637" r="22" fill="#12507C"/><text x="62" y="645" text-anchor="middle" font-size="23" font-weight="700" fill="white">7</text><text x="104" y="631" font-size="21" font-weight="700" fill="#12507C">Add your first fish</text><text x="104" y="655" font-size="18" fill="#36566D">Only after cycle confirmation; acclimate a compatible group.</text><path d="M62 673v9m-4-4 4 4 4-4" fill="none" stroke="#597D96" stroke-width="2"/><rect x="28" y="685" width="844" height="67" rx="12" fill="white" stroke="#C9DFED"/><circle cx="62" cy="718" r="22" fill="#12507C"/><text x="62" y="726" text-anchor="middle" font-size="23" font-weight="700" fill="white">8</text><text x="104" y="712" font-size="21" font-weight="700" fill="#12507C">Test again + keep a log</text><text x="104" y="736" font-size="18" fill="#36566D">Monitor ammonia and nitrite; record maintenance.</text><text x="450" y="800" text-anchor="middle" font-size="18" fill="#36566D">Setup takes hours. Cycling often takes weeks. Test results decide readiness.</text></g></svg>