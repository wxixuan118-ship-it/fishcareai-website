<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Where to measure an aquarium</title><desc id="desc">An aquarium in three-quarter view with five numbered measuring points: inside length, inside width front to back, water height rather than tank height, and the substrate and hardscape that displace water volume. Nominal capacity is not usable water volume.</desc>
<defs><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#597D96"/></marker></defs>
<rect width="900" height="560" rx="18" fill="#EFF7FD"/><path d="M18 0H882Q900 0 900 18V98H0V18Q0 0 18 0" fill="#12507C"/>
<g font-family="Segoe UI,Helvetica,Arial,sans-serif">
<text x="32" y="44" font-size="29" font-weight="700" fill="white">Where to measure an aquarium</text>
<text x="32" y="76" font-size="18" fill="#DAEEFF">Nominal capacity is not usable water volume</text>

<g transform="translate(28,120)">
<rect width="844" height="330" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#0F3D5E">Five points that decide the answer</text>

<path d="M40 120 96 84H416l-56 36Z" fill="#E8F4FC"/>
<path d="M40 160 96 124h320l-56 36Z" fill="#AED8F0"/>
<path d="M360 160 416 124v76l-56 36Z" fill="#C6E4F7"/>
<path d="M360 236 416 200v26l-56 36Z" fill="#8A4A12"/>
<rect x="40" y="160" width="320" height="76" fill="#DCEEFB"/>
<rect x="40" y="236" width="320" height="26" fill="#B75A12"/>
<path d="M200 236 226 212l30 24Z" fill="#8FA3AD" stroke="#6E828C" stroke-width="2"/>
<path d="M40 120v142h320V120M360 120 416 84v142l-56 36M40 120 96 84h320" fill="none" stroke="#12507C" stroke-width="3"/>
<path d="M40 160H360" stroke="#1B7FB8" stroke-width="2" stroke-dasharray="7 4"/>

<path d="M40 288H360" stroke="#597D96" stroke-width="2" marker-start="url(#am)" marker-end="url(#am)"/>
<path d="M374 274 430 238" stroke="#597D96" stroke-width="2" marker-start="url(#am)" marker-end="url(#am)"/>
<path d="M22 160V262" stroke="#597D96" stroke-width="2" marker-start="url(#am)" marker-end="url(#am)"/>
<g fill="#12507C"><circle cx="200" cy="288" r="14"/><circle cx="402" cy="256" r="14"/><circle cx="22" cy="211" r="14"/><circle cx="104" cy="249" r="14"/><circle cx="226" cy="196" r="14"/></g>
<g fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle"><text x="200" y="294">1</text><text x="402" y="262">2</text><text x="22" y="217">3</text><text x="104" y="255">4</text><text x="226" y="202">5</text></g>

<g font-size="16" font-weight="700" fill="#0F3D5E"><text x="536" y="105">Inside length</text><text x="536" y="147">Inside width</text><text x="536" y="189">Water height</text><text x="536" y="231">Substrate</text><text x="536" y="273">Rock and decor</text></g>
<g font-size="13.5" fill="#36566D"><text x="536" y="125">Inside the glass, not across the outer trim</text><text x="536" y="167">Front to back, also inside the glass</text><text x="536" y="209">The fill line — not the height of the tank</text><text x="536" y="251">Displaces water: subtract it from volume</text><text x="536" y="293">Displaces water: subtract it from volume</text></g>
<g fill="#12507C"><circle cx="512" cy="100" r="13"/><circle cx="512" cy="142" r="13"/><circle cx="512" cy="184" r="13"/><circle cx="512" cy="226" r="13"/><circle cx="512" cy="268" r="13"/></g>
<g fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle"><text x="512" y="105">1</text><text x="512" y="147">2</text><text x="512" y="189">3</text><text x="512" y="231">4</text><text x="512" y="273">5</text></g>
</g>

<rect x="28" y="460" width="844" height="76" rx="12" fill="#E0F2EB" stroke="#9BCDBA"/>
<text x="48" y="492" font-size="20" font-weight="700" fill="#185B47">Nominal capacity is not usable water volume</text>
<text x="48" y="520" font-size="16" fill="#244D40">Substrate and hardscape often take a 20 gal tank to ~17 gal — measure inside, then subtract.</text>
</g></svg>
