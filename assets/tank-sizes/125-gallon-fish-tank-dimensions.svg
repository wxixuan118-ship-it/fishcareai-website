<title id="ts-diagram-title-125">125 gallon fish tank dimensions diagram: 72 × 18 × 22 inches (183 × 46 × 56 cm)</title>
<desc id="ts-diagram-desc-125">Simple 3D outline of a Standard 125 gallon aquarium showing length 72 in (183 cm), width 18 in (46 cm) and height 22 in (56 cm), with the water line drawn near the top of the glass.</desc>
