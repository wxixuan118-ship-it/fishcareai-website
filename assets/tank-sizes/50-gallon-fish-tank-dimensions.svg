<title id="ts-diagram-title-50">50 gallon fish tank dimensions diagram: 36 × 18 × 19 inches (91 × 46 × 48 cm)</title>
<desc id="ts-diagram-desc-50">Simple 3D outline of a Standard 50 gallon aquarium showing length 36 in (91 cm), width 18 in (46 cm) and height 19 in (48 cm), with the water line drawn near the top of the glass.</desc>
