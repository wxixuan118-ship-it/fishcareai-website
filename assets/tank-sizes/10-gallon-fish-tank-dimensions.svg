<title id="ts-diagram-title-10">10 gallon fish tank dimensions diagram: 20 × 10 × 12 inches (51 × 25 × 30 cm)</title>
<desc id="ts-diagram-desc-10">Simple 3D outline of a Standard 10 gallon aquarium showing length 20 in (51 cm), width 10 in (25 cm) and height 12 in (30 cm), with the water line drawn near the top of the glass.</desc>
