<title id="ts-diagram-title-5">5 gallon fish tank dimensions diagram: 16 × 8 × 10 inches (41 × 20 × 25 cm)</title>
<desc id="ts-diagram-desc-5">Simple 3D outline of a Standard 5 gallon aquarium showing length 16 in (41 cm), width 8 in (20 cm) and height 10 in (25 cm), with the water line drawn near the top of the glass.</desc>
