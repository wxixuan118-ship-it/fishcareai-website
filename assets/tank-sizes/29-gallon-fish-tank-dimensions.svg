<title id="ts-diagram-title-29">29 gallon fish tank dimensions diagram: 30 × 12 × 18 inches (76 × 30 × 46 cm)</title>
<desc id="ts-diagram-desc-29">Simple 3D outline of a Standard 29 gallon aquarium showing length 30 in (76 cm), width 12 in (30 cm) and height 18 in (46 cm), with the water line drawn near the top of the glass.</desc>
