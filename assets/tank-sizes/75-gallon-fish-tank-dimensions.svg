<title id="ts-diagram-title-75">75 gallon fish tank dimensions diagram: 48 × 18 × 21 inches (122 × 46 × 53 cm)</title>
<desc id="ts-diagram-desc-75">Simple 3D outline of a Standard 75 gallon aquarium showing length 48 in (122 cm), width 18 in (46 cm) and height 21 in (53 cm), with the water line drawn near the top of the glass.</desc>
