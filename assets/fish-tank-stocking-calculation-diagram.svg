<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">How the fish tank stocking calculator works</title><desc id="desc">Left: two aquariums holding the same six inches of fish — four neon tetras versus one fancy goldfish — with the goldfish carrying three times the bioload at 12 gallons of load against 4, which is why the calculator scores each species by gallons per fish rather than by length alone; below, the three limits the tool checks: bioload, which filtration and plants can move; swimming space, which only volume moves; and group size. Right: the four-step calculation worked for a 20 gallon tank with a correctly rated filter — capacity 20 gallons of load, fish load 8 neon tetras at 1 gallon plus 6 corydoras at 1.5 gallons equals 17, stocking 17 over 20 equals 85 percent, well stocked — followed by the minimum tank and group size checks, and a stocking meter with the 85 percent result marked.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7DEBFF"/></marker>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46B6E8" stop-opacity=".40"/><stop offset="1" stop-color="#1687C7" stop-opacity=".55"/></linearGradient>
<linearGradient id="meter" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#18A999"/><stop offset=".4" stop-color="#27AE60"/><stop offset=".6" stop-color="#27AE60"/><stop offset=".73" stop-color="#F39C12"/><stop offset=".87" stop-color="#E67E22"/><stop offset="1" stop-color="#E74C3C"/></linearGradient>
<pattern id="sand" width="10" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#E3B27A" opacity=".7"/><circle cx="7" cy="6" r="1" fill="#E3B27A" opacity=".5"/></pattern>
<style>
text{font-family:-apple-system,'Segoe UI',Arial,sans-serif;fill:#EAFBFF}
.t{font-size:20px;font-weight:800}
.h{font-size:14px;font-weight:700;fill:#7DEBFF;letter-spacing:.04em;text-transform:uppercase}
.l{font-size:13px;font-weight:700}
.s{font-size:11.5px;fill:#B8DCEB}
.m{font-size:11.5px;fill:#7F9BB0}
.f{font-size:13px;font-weight:700;fill:#fff}
.n{font-size:12px;fill:#0A2540;font-weight:800}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;fill:#9DEBFF}
.big{font-size:22px;font-weight:800;fill:#fff}
</style>
</defs>

<!-- canvas -->
<rect width="900" height="560" rx="16" fill="#0A2540"/>
<rect x=".5" y=".5" width="899" height="559" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
<text x="30" y="40" class="t">How the fish tank stocking calculator works</text>
<text x="30" y="60" class="m">Score each fish by gallons of load, not inches → add them up → compare with what the tank and filter can carry</text>

<!-- ───────── LEFT: why inches mislead ───────── -->
<text x="30" y="92" class="h">Same inches, not the same load</text>

<!-- Tank A: 4 neon tetras -->
<g>
<rect x="34" y="106" width="190" height="8" rx="2" fill="#1B3A5A" stroke="#7DEBFF" stroke-opacity=".35"/>
<rect x="40" y="114" width="178" height="120" fill="url(#water)" stroke="#3E6C8E" stroke-width="3"/>
<rect x="43" y="218" width="172" height="14" fill="url(#sand)"/>
<rect x="43" y="218" width="172" height="14" fill="#8C5A32" fill-opacity=".45"/>
<!-- neon tetras -->
<g id="neon">
<path d="M-11 0 -15 -5 -15 5z" fill="#E74C3C"/>
<ellipse cx="0" cy="0" rx="11" ry="4.2" fill="#B8DCEB"/>
<path d="M-11 -.5 H 8" stroke="#46B6E8" stroke-width="2.4"/>
<path d="M-11 2.2 H 4" stroke="#E74C3C" stroke-width="2"/>
<circle cx="7.5" cy="-1" r="1.1" fill="#0A2540"/>
</g>
<use href="#neon" x="80" y="150"/>
<use href="#neon" x="120" y="165"/>
<use href="#neon" x="160" y="150"/>
<use href="#neon" x="105" y="192"/>
<text x="129" y="256" class="l" text-anchor="middle">4 neon tetras</text>
<text x="129" y="273" class="s" text-anchor="middle">4 × 1.5 in = 6 in of fish</text>
<rect x="64" y="284" width="130" height="24" rx="12" fill="#18A999" fill-opacity=".22" stroke="#18A999" stroke-opacity=".7"/>
<text x="129" y="300" class="f" text-anchor="middle">4 gal of load</text>
</g>

<!-- Tank B: 1 fancy goldfish -->
<g>
<rect x="244" y="106" width="190" height="8" rx="2" fill="#1B3A5A" stroke="#7DEBFF" stroke-opacity=".35"/>
<rect x="250" y="114" width="178" height="120" fill="url(#water)" stroke="#3E6C8E" stroke-width="3"/>
<rect x="253" y="218" width="172" height="14" fill="url(#sand)"/>
<rect x="253" y="218" width="172" height="14" fill="#8C5A32" fill-opacity=".45"/>
<!-- goldfish -->
<g transform="translate(340 168)">
<path d="M-24 0 C -40 -22, -52 -18, -46 0 C -52 18, -40 22, -24 0z" fill="#F39C12" fill-opacity=".85"/>
<ellipse cx="0" cy="0" rx="28" ry="19" fill="#F5B041"/>
<path d="M-8 -19 C -4 -30, 8 -30, 12 -19z" fill="#F39C12"/>
<path d="M-4 19 C -2 27, 6 27, 8 19z" fill="#F39C12"/>
<circle cx="18" cy="-5" r="3" fill="#0A2540"/>
<circle cx="19" cy="-6" r="1" fill="#fff"/>
</g>
<text x="339" y="256" class="l" text-anchor="middle">1 fancy goldfish</text>
<text x="339" y="273" class="s" text-anchor="middle">1 × 6 in = 6 in of fish</text>
<rect x="274" y="284" width="130" height="24" rx="12" fill="#E74C3C" fill-opacity=".22" stroke="#E74C3C" stroke-opacity=".75"/>
<text x="339" y="300" class="f" text-anchor="middle">12 gal of load</text>
</g>

<!-- callout -->
<text x="234" y="334" class="s" text-anchor="middle">Same length on the inch-per-gallon rule — three times the waste in the filter.</text>
<text x="234" y="350" class="s" text-anchor="middle">So every species carries its own gallons-per-fish figure.</text>

<!-- three limits -->
<text x="30" y="386" class="h">Three limits the tool checks</text>
<g>
<rect x="30" y="398" width="404" height="38" rx="9" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
<circle cx="50" cy="417" r="11" fill="#18A999"/><text x="50" y="421" class="n" text-anchor="middle">1</text>
<text x="70" y="413" class="l">Bioload</text>
<text x="70" y="428" class="s">Filter and plants move this — that is the ×0.85 to ×1.15 adjustment.</text>
</g>
<g>
<rect x="30" y="444" width="404" height="38" rx="9" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
<circle cx="50" cy="463" r="11" fill="#1687C7"/><text x="50" y="467" class="n" text-anchor="middle">2</text>
<text x="70" y="459" class="l">Swimming space</text>
<text x="70" y="474" class="s">Only volume moves this — the minimum-tank check ignores the filter.</text>
</g>
<g>
<rect x="30" y="490" width="404" height="38" rx="9" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
<circle cx="50" cy="509" r="11" fill="#F39C12"/><text x="50" y="513" class="n" text-anchor="middle">3</text>
<text x="70" y="505" class="l">Group size</text>
<text x="70" y="520" class="s">Schooling fish below their minimum group are flagged however light the tank is.</text>
</g>

<!-- divider -->
<line x1="456" y1="84" x2="456" y2="532" stroke="#ffffff" stroke-opacity=".12"/>

<!-- ───────── RIGHT: the calculation ───────── -->
<text x="478" y="92" class="h">The calculation, worked for a 20 gallon tank</text>

<!-- step 1 -->
<g>
<rect x="478" y="104" width="392" height="62" rx="10" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
<circle cx="500" cy="135" r="12" fill="#7DEBFF"/><text x="500" y="139" class="n" text-anchor="middle">1</text>
<text x="522" y="124" class="l">Capacity = volume × filter × plants</text>
<text x="522" y="142" class="mono">20 gal × 1.0 (good filter) × 1.0 (few plants)</text>
<text x="522" y="158" class="f">= 20.0 gal of load the tank can carry</text>
</g>
<line x1="674" y1="166" x2="674" y2="180" stroke="#7DEBFF" stroke-width="1.5" marker-end="url(#ah)"/>

<!-- step 2 -->
<g>
<rect x="478" y="184" width="392" height="62" rx="10" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
<circle cx="500" cy="215" r="12" fill="#7DEBFF"/><text x="500" y="219" class="n" text-anchor="middle">2</text>
<text x="522" y="204" class="l">Fish load = Σ count × gallons per fish</text>
<text x="522" y="222" class="mono">8 neon tetra × 1.0  +  6 corydoras × 1.5</text>
<text x="522" y="238" class="f">= 8 + 9 = 17.0 gal of load at adult size</text>
</g>
<line x1="674" y1="246" x2="674" y2="260" stroke="#7DEBFF" stroke-width="1.5" marker-end="url(#ah)"/>

<!-- step 3 -->
<g>
<rect x="478" y="264" width="392" height="62" rx="10" fill="#18A999" fill-opacity=".14" stroke="#18A999" stroke-opacity=".6"/>
<circle cx="500" cy="295" r="12" fill="#18A999"/><text x="500" y="299" class="n" text-anchor="middle">3</text>
<text x="522" y="284" class="l">Stocking level = load ÷ capacity</text>
<text x="522" y="302" class="mono">17.0 ÷ 20.0</text>
<text x="522" y="318" class="f">= 85% — well stocked</text>
</g>
<line x1="674" y1="326" x2="674" y2="340" stroke="#7DEBFF" stroke-width="1.5" marker-end="url(#ah)"/>

<!-- step 4 -->
<g>
<rect x="478" y="344" width="392" height="62" rx="10" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
<circle cx="500" cy="375" r="12" fill="#7DEBFF"/><text x="500" y="379" class="n" text-anchor="middle">4</text>
<text x="522" y="364" class="l">Checks no filter can override</text>
<text x="522" y="382" class="s">Min tank: corydoras 20 gal ✓ · neon tetra 10 gal ✓</text>
<text x="522" y="398" class="s">Group size: 8 neon ≥ 6 ✓ · 6 corydoras ≥ 6 ✓</text>
</g>

<!-- meter -->
<text x="478" y="434" class="h">Where 85% sits</text>
<rect x="478" y="444" width="392" height="16" rx="8" fill="url(#meter)"/>
<!-- tick marks: 0,60,90,110,130,150 across 392px -->
<g class="m">
<text x="478" y="478" class="m">0%</text>
<text x="635" y="478" class="m" text-anchor="middle">60</text>
<text x="713" y="478" class="m" text-anchor="middle">90</text>
<text x="766" y="478" class="m" text-anchor="middle">110</text>
<text x="818" y="478" class="m" text-anchor="middle">130</text>
<text x="870" y="478" class="m" text-anchor="end">150%+</text>
</g>
<line x1="635" y1="442" x2="635" y2="462" stroke="#0A2540" stroke-width="2"/>
<line x1="713" y1="442" x2="713" y2="462" stroke="#0A2540" stroke-width="2"/>
<line x1="766" y1="442" x2="766" y2="462" stroke="#0A2540" stroke-width="2"/>
<line x1="818" y1="442" x2="818" y2="462" stroke="#0A2540" stroke-width="2"/>
<!-- 85% marker: 478 + 85/150*392 = 700 -->
<path d="M700 434 l-7 -10 h14z" fill="#fff"/>
<line x1="700" y1="440" x2="700" y2="464" stroke="#fff" stroke-width="2.5"/>
<text x="478" y="502" class="s">lightly · well · fully · heavily · overstocked</text>
<text x="478" y="520" class="s">Under 90% leaves margin. Over 100% is full at adult size,</text>
<text x="478" y="536" class="s">whatever the fish look like today.</text>
</svg>
