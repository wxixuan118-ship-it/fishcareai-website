<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
<title id="t">Koi pond setup in eight steps</title>
<desc id="d">The build order for a koi pond: site the pond in partial shade, excavate with the plumbing in mind, lay underlay and EPDM liner, plumb the filtration from bottom drain and skimmer, add year-round aeration, fill and dechlorinate the whole volume, cycle the filter for four to six weeks until ammonia and nitrite read zero, then stock slowly two or three koi at a time.</desc>
<rect width="900" height="470" rx="18" fill="#EFF7FD"/>
<path d="M18 0H882Q900 0 900 18V98H0V18Q0 0 18 0" fill="#12507C"/>
<g font-family="Segoe UI,Helvetica,Arial,sans-serif">
<text x="32" y="44" font-size="29" font-weight="700" fill="#FFFFFF">Koi pond setup, step by step</text>
<text x="32" y="76" font-size="18" fill="#DAEEFF">Get the water stable before the fish arrive &#8212; steps 6 to 8 are where ponds are lost</text>
<g font-size="15">
<g transform="translate(30,120)"><rect width="196" height="144" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/><circle cx="30" cy="32" r="17" fill="#12507C"/><text x="30" y="38" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="58" y="38" font-size="17" font-weight="700" fill="#0F3D5E">Site it</text><text x="18" y="72" fill="#5A7A94">Partial shade 4&#8211;6 h.</text><text x="18" y="94" fill="#5A7A94">Away from deciduous</text><text x="18" y="116" fill="#5A7A94">trees and runoff.</text></g>
<g transform="translate(244,120)"><rect width="196" height="144" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/><circle cx="30" cy="32" r="17" fill="#12507C"/><text x="30" y="38" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="58" y="38" font-size="17" font-weight="700" fill="#0F3D5E">Excavate</text><text x="18" y="72" fill="#5A7A94">Deep zone first. Slope</text><text x="18" y="94" fill="#5A7A94">1&#8211;2 in per 10 ft to a</text><text x="18" y="116" fill="#5A7A94">bottom drain.</text></g>
<g transform="translate(458,120)"><rect width="196" height="144" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/><circle cx="30" cy="32" r="17" fill="#12507C"/><text x="30" y="38" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="58" y="38" font-size="17" font-weight="700" fill="#0F3D5E">Line it</text><text x="18" y="72" fill="#5A7A94">Geotextile underlay,</text><text x="18" y="94" fill="#5A7A94">then 45-mil EPDM.</text><text x="18" y="116" fill="#5A7A94">Seal raw concrete.</text></g>
<g transform="translate(672,120)"><rect width="196" height="144" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/><circle cx="30" cy="32" r="17" fill="#12507C"/><text x="30" y="38" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="58" y="38" font-size="17" font-weight="700" fill="#0F3D5E">Plumb it</text><text x="18" y="72" fill="#5A7A94">Drain + skimmer to</text><text x="18" y="94" fill="#5A7A94">pump. Oversize pipe:</text><text x="18" y="116" fill="#5A7A94">2 in, not 1.5 in.</text></g>
<g transform="translate(30,286)"><rect width="196" height="144" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/><circle cx="30" cy="32" r="17" fill="#12507C"/><text x="30" y="38" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="58" y="38" font-size="17" font-weight="700" fill="#0F3D5E">Aerate</text><text x="18" y="72" fill="#5A7A94">Air pump + bottom</text><text x="18" y="94" fill="#5A7A94">diffuser, year-round.</text><text x="18" y="116" fill="#5A7A94">Cheapest insurance.</text></g>
<g transform="translate(244,286)"><rect width="196" height="144" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/><circle cx="30" cy="32" r="17" fill="#12507C"/><text x="30" y="38" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="58" y="38" font-size="17" font-weight="700" fill="#0F3D5E">Fill</text><text x="18" y="72" fill="#5A7A94">Dechlorinate the whole</text><text x="18" y="94" fill="#5A7A94">volume for chlorine</text><text x="18" y="116" fill="#5A7A94">and chloramine.</text></g>
<g transform="translate(458,286)"><rect width="196" height="144" rx="14" fill="#FFF6E8" stroke="#E8C48A"/><circle cx="30" cy="32" r="17" fill="#B7791F"/><text x="30" y="38" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="58" y="38" font-size="17" font-weight="700" fill="#8A5A12">Cycle</text><text x="18" y="72" fill="#7A6034">4&#8211;6 weeks. No koi</text><text x="18" y="94" fill="#7A6034">until ammonia and</text><text x="18" y="116" fill="#7A6034">nitrite read 0 ppm.</text></g>
<g transform="translate(672,286)"><rect width="196" height="144" rx="14" fill="#EDFAF3" stroke="#9BD8BB"/><circle cx="30" cy="32" r="17" fill="#1E7D53"/><text x="30" y="38" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text><text x="58" y="38" font-size="17" font-weight="700" fill="#14603F">Stock</text><text x="18" y="72" fill="#3E6B57">2&#8211;3 koi, wait three</text><text x="18" y="94" fill="#3E6B57">weeks, test, repeat.</text><text x="18" y="116" fill="#3E6B57">Quarantine 3&#8211;4 wks.</text></g>
</g>
<g fill="#9FC4DC">
<path d="M228 192h10l-5 -7 12 7 -12 7 5 -7h-10z"/><path d="M442 192h10l-5 -7 12 7 -12 7 5 -7h-10z"/><path d="M656 192h10l-5 -7 12 7 -12 7 5 -7h-10z"/>
<path d="M228 358h10l-5 -7 12 7 -12 7 5 -7h-10z"/><path d="M442 358h10l-5 -7 12 7 -12 7 5 -7h-10z"/><path d="M656 358h10l-5 -7 12 7 -12 7 5 -7h-10z"/>
</g>
</g>
</svg>
