<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Aquarium water parameters at a glance: temperature 74 to 80 degrees Fahrenheit, pH 6.8 to 7.8, ammonia 0 ppm, nitrite 0 ppm, nitrate under 20 ppm, hardness GH 4 to 12 dGH and KH 4 to 8 dKH.">
<defs>
<linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12507C"/><stop offset="1" stop-color="#1B7FB8"/></linearGradient>
<linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4FAFF"/><stop offset="1" stop-color="#E7F3FC"/></linearGradient>
</defs>
<rect width="900" height="470" rx="18" fill="url(#bgg)"/>
<rect width="900" height="104" rx="18" fill="url(#hd)"/><rect y="72" width="900" height="32" fill="#1B7FB8"/>
<g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">
<text x="450" y="48" font-size="30" font-weight="800" fill="#FFFFFF">Aquarium Water Parameters</text>
<text x="450" y="80" font-size="16" font-weight="600" fill="#CFEBFF">Healthy water. Happy fish. Test before you treat.</text>
</g>
<g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">

<g transform="translate(28,128)">
<rect width="272" height="150" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/>
<rect width="6" height="150" rx="3" fill="#C0392B"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#0F3D5E">Temperature</text>
<text x="24" y="76" font-size="28" font-weight="800" fill="#12507C">74–80°F</text>
<text x="24" y="99" font-size="15" font-weight="600" fill="#2A4A63">23–27°C</text>
<text x="24" y="126" font-size="13" fill="#2A4A63">Stability matters most: keep swings</text>
<text x="24" y="142" font-size="13" fill="#2A4A63">under 4°F in any 24 hours.</text>
</g>

<g transform="translate(314,128)">
<rect width="272" height="150" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/>
<rect width="6" height="150" rx="3" fill="#1B7A45"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#0F3D5E">pH</text>
<g transform="translate(24,46)">
<rect width="26" height="12" rx="3" fill="#D9453B"/><rect x="29" width="26" height="12" rx="3" fill="#EE8A2F"/><rect x="58" width="26" height="12" rx="3" fill="#EFC53F"/><rect x="87" width="26" height="12" rx="3" fill="#7CBF52"/><rect x="116" width="26" height="12" rx="3" fill="#2E9E7D"/><rect x="145" width="26" height="12" rx="3" fill="#2E84C0"/><rect x="174" width="26" height="12" rx="3" fill="#3C4FA0"/>
</g>
<text x="24" y="92" font-size="28" font-weight="800" fill="#12507C">6.8–7.8</text>
<text x="24" y="118" font-size="13" fill="#2A4A63">A steady 7.2 beats a pH that swings</text>
<text x="24" y="134" font-size="13" fill="#2A4A63">between 6.5 and 8.0.</text>
</g>

<g transform="translate(600,128)">
<rect width="272" height="150" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/>
<rect width="6" height="150" rx="3" fill="#C0392B"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#0F3D5E">Ammonia (NH₃ / NH₄⁺)</text>
<text x="24" y="80" font-size="28" font-weight="800" fill="#C0392B">0 ppm</text>
<text x="24" y="106" font-size="13" fill="#2A4A63">Toxic at any reading. The higher your</text>
<text x="24" y="122" font-size="13" fill="#2A4A63">pH, the more of it is the toxic</text>
<text x="24" y="138" font-size="13" fill="#2A4A63">free-ammonia form.</text>
</g>

<g transform="translate(28,294)">
<rect width="272" height="150" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/>
<rect width="6" height="150" rx="3" fill="#8A5200"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#0F3D5E">Nitrite (NO₂⁻)</text>
<text x="24" y="80" font-size="28" font-weight="800" fill="#C0392B">0 ppm</text>
<text x="24" y="106" font-size="13" fill="#2A4A63">Blocks oxygen transport in the blood.</text>
<text x="24" y="122" font-size="13" fill="#2A4A63">Water change immediately if it</text>
<text x="24" y="138" font-size="13" fill="#2A4A63">registers at all.</text>
</g>

<g transform="translate(314,294)">
<rect width="272" height="150" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/>
<rect width="6" height="150" rx="3" fill="#2E84C0"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#0F3D5E">Nitrate (NO₃⁻)</text>
<text x="24" y="80" font-size="28" font-weight="800" fill="#1B7A45">&lt; 20 ppm</text>
<text x="24" y="106" font-size="13" fill="#2A4A63">Controlled by weekly 25–30% water</text>
<text x="24" y="122" font-size="13" fill="#2A4A63">changes and live plants. Chronic 40+</text>
<text x="24" y="138" font-size="13" fill="#2A4A63">ppm suppresses immunity.</text>
</g>

<g transform="translate(600,294)">
<rect width="272" height="150" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/>
<rect width="6" height="150" rx="3" fill="#2E9E7D"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#0F3D5E">Hardness (GH / KH)</text>
<text x="24" y="72" font-size="21" font-weight="800" fill="#12507C">GH 4–12 dGH</text>
<text x="24" y="99" font-size="21" font-weight="800" fill="#12507C">KH 4–8 dKH</text>
<text x="24" y="124" font-size="13" fill="#2A4A63">KH is your pH buffer. Below 3 dKH,</text>
<text x="24" y="140" font-size="13" fill="#2A4A63">overnight pH crashes become likely.</text>
</g>

<text x="450" y="462" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A7A94">fishcareai.com · Aquarium Water Parameters Guide</text>
</g>
</svg>
