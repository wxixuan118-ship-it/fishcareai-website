<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Betta fish care at a glance: tank size 5 gallons minimum and 10 gallons better, temperature 76 to 81 degrees Fahrenheit or 24 to 27 Celsius, pH 6.5 to 7.8, ammonia and nitrite both 0 ppm, nitrate kept low with a 20 to 30 percent weekly water change, and a typical total lifespan of 2 to 5 years.">
<defs>
<linearGradient id="bhd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12507C"/><stop offset="1" stop-color="#1B7FB8"/></linearGradient>
<linearGradient id="bbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4FAFF"/><stop offset="1" stop-color="#E7F3FC"/></linearGradient>
</defs>
<rect width="900" height="470" rx="18" fill="url(#bbg)"/>
<rect width="900" height="104" rx="18" fill="url(#bhd)"/><rect y="72" width="900" height="32" fill="#1B7FB8"/>
<g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">
<text x="450" y="48" font-size="30" font-weight="800" fill="#FFFFFF">Betta Fish Care at a Glance</text>
<text x="450" y="80" font-size="16" font-weight="600" fill="#CFEBFF">Betta splendens — one fish, one heated and filtered tank</text>
</g>
<g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">

<g transform="translate(28,128)">
<rect width="272" height="150" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/>
<rect width="6" height="150" rx="3" fill="#1B7FB8"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#0F3D5E">Tank size</text>
<text x="24" y="76" font-size="28" font-weight="800" fill="#12507C">5 gal min</text>
<text x="24" y="99" font-size="15" font-weight="600" fill="#2A4A63">10 gal is easier to keep</text>
<text x="24" y="126" font-size="13" fill="#2A4A63">More water dilutes waste and</text>
<text x="24" y="142" font-size="13" fill="#2A4A63">slows temperature swings.</text>
</g>

<g transform="translate(314,128)">
<rect width="272" height="150" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/>
<rect width="6" height="150" rx="3" fill="#C0392B"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#0F3D5E">Temperature</text>
<text x="24" y="76" font-size="28" font-weight="800" fill="#12507C">76–81°F</text>
<text x="24" y="99" font-size="15" font-weight="600" fill="#2A4A63">24–27°C</text>
<text x="24" y="126" font-size="13" fill="#2A4A63">Needs a thermostatic heater —</text>
<text x="24" y="142" font-size="13" fill="#2A4A63">room temperature is not enough.</text>
</g>

<g transform="translate(600,128)">
<rect width="272" height="150" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/>
<rect width="6" height="150" rx="3" fill="#1B7A45"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#0F3D5E">pH</text>
<text x="24" y="76" font-size="28" font-weight="800" fill="#12507C">6.5–7.8</text>
<text x="24" y="99" font-size="15" font-weight="600" fill="#2A4A63">Stability beats the number</text>
<text x="24" y="126" font-size="13" fill="#2A4A63">Chasing an exact pH with</text>
<text x="24" y="142" font-size="13" fill="#2A4A63">chemicals causes more harm.</text>
</g>

<g transform="translate(28,292)">
<rect width="272" height="150" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/>
<rect width="6" height="150" rx="3" fill="#8E44AD"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#0F3D5E">Ammonia &amp; nitrite</text>
<text x="24" y="76" font-size="28" font-weight="800" fill="#12507C">0 ppm</text>
<text x="24" y="99" font-size="15" font-weight="600" fill="#2A4A63">Both, always</text>
<text x="24" y="126" font-size="13" fill="#2A4A63">Any reading above zero is an</text>
<text x="24" y="142" font-size="13" fill="#2A4A63">emergency, not a fine-tune.</text>
</g>

<g transform="translate(314,292)">
<rect width="272" height="150" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/>
<rect width="6" height="150" rx="3" fill="#D68910"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#0F3D5E">Nitrate control</text>
<text x="24" y="76" font-size="28" font-weight="800" fill="#12507C">20–30%</text>
<text x="24" y="99" font-size="15" font-weight="600" fill="#2A4A63">Water change, weekly</text>
<text x="24" y="126" font-size="13" fill="#2A4A63">Dechlorinated and matched to</text>
<text x="24" y="142" font-size="13" fill="#2A4A63">tank temperature.</text>
</g>

<g transform="translate(600,292)">
<rect width="272" height="150" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/>
<rect width="6" height="150" rx="3" fill="#16A085"/>
<text x="24" y="34" font-size="16" font-weight="700" fill="#0F3D5E">Lifespan</text>
<text x="24" y="76" font-size="28" font-weight="800" fill="#12507C">2–5 years</text>
<text x="24" y="99" font-size="15" font-weight="600" fill="#2A4A63">Total, not after purchase</text>
<text x="24" y="126" font-size="13" fill="#2A4A63">Bettas are sold as adults, so</text>
<text x="24" y="142" font-size="13" fill="#2A4A63">age at purchase is unknown.</text>
</g>

</g>
</svg>
