<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">How aquarium substrate volume is calculated</title><desc id="desc">Two aquarium cross-sections. A flat bed uses length times width times depth. A sloped bed averages the front and back depth first, then multiplies by the footprint. Worked example: a 30 by 12 inch footprint with a 2 inch flat bed is 720 cubic inches, about 11.8 litres, roughly 41.6 pounds of gravel.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#8C430C"/></marker></defs>
<rect width="900" height="520" rx="18" fill="#EFF7FD"/><path d="M18 0H882Q900 0 900 18V98H0V18Q0 0 18 0" fill="#12507C"/>
<g font-family="Segoe UI,Helvetica,Arial,sans-serif">
<text x="32" y="44" font-size="29" font-weight="700" fill="white">How aquarium substrate volume is calculated</text>
<text x="32" y="76" font-size="18" fill="#DAEEFF">Footprint × bed depth — tank height is not part of it</text>

<g transform="translate(28,120)">
<rect width="410" height="280" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#0F3D5E">Flat bed</text>
<rect x="92" y="58" width="226" height="102" fill="#DCEEFB"/>
<rect x="92" y="160" width="226" height="34" fill="#B75A12"/>
<g fill="#DE9A5B"><circle cx="112" cy="168" r="3"/><circle cx="146" cy="172" r="3"/><circle cx="182" cy="167" r="3"/><circle cx="216" cy="173" r="3"/><circle cx="250" cy="168" r="3"/><circle cx="284" cy="172" r="3"/></g>
<rect x="90" y="56" width="230" height="140" fill="none" stroke="#12507C" stroke-width="3"/>
<path d="M334 160V194" stroke="#8C430C" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="344" y="182" font-size="15" font-weight="700" fill="#8C430C">D</text>
<path d="M90 214H320" stroke="#597D96" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="205" y="238" text-anchor="middle" font-size="15" fill="#36566D">Length (L) × Width (W) = footprint</text>
<text x="24" y="266" font-size="17" font-weight="700" fill="#12507C">Volume = L × W × D</text>
</g>

<g transform="translate(462,120)">
<rect width="410" height="280" rx="14" fill="#FFFFFF" stroke="#CFE3F1"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#0F3D5E">Sloped bed</text>
<path d="M92 58H318v70L92 168Z" fill="#DCEEFB"/>
<path d="M92 168 318 128v66H92Z" fill="#B75A12"/>
<g fill="#DE9A5B"><circle cx="120" cy="175" r="3"/><circle cx="158" cy="168" r="3"/><circle cx="196" cy="162" r="3"/><circle cx="234" cy="155" r="3"/><circle cx="272" cy="148" r="3"/><circle cx="304" cy="143" r="3"/></g>
<path d="M92 148H318" stroke="#12507C" stroke-width="2" stroke-dasharray="8 5"/>
<rect x="90" y="56" width="230" height="140" fill="none" stroke="#12507C" stroke-width="3"/>
<g stroke="#B99172" stroke-width="1"><path d="M74 168H92M74 194H92M318 128H338M318 194H338"/></g>
<path d="M78 168V194" stroke="#8C430C" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="68" y="186" text-anchor="end" font-size="14" fill="#8C430C">Front</text>
<text x="68" y="153" text-anchor="end" font-size="14" fill="#12507C">average</text>
<path d="M334 128V194" stroke="#8C430C" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="344" y="166" font-size="14" fill="#8C430C">Back</text>
<text x="24" y="238" font-size="16" font-weight="700" fill="#12507C">Average Depth = (Front + Back) ÷ 2</text>
<text x="24" y="266" font-size="16" font-weight="700" fill="#12507C">Volume = L × W × Average Depth</text>
</g>

<rect x="28" y="418" width="844" height="82" rx="12" fill="#E0F2EB" stroke="#9BCDBA"/>
<text x="48" y="450" font-size="20" font-weight="700" fill="#185B47">Worked example — 30 × 12 in footprint, 2 in flat bed</text>
<text x="48" y="480" font-size="17" fill="#244D40">30 × 12 × 2 = 720 in³ → 11.8 L → about 41.6 lb (18.9 kg) of gravel at a typical 1.60 g/cm³</text>
</g></svg>
