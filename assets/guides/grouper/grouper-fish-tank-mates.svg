<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Grouper fish tank mates: bigger than the mouth, tougher than the temper</title>
<desc id="d">Grouper fish tank mates chart: lionfish, foxface, large tangs, angels, wrasses and moray eels work; triggers with care; clownfish, gobies, damsels, shrimp and crabs are eaten; a second grouper only in 300 gallons or more</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061b2c"/><stop offset="1" stop-color="#0c3d5c"/></linearGradient><linearGradient id="ok" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2bd4c4"/><stop offset="1" stop-color="#27ae60"/></linearGradient></defs>
<rect width="1200" height="640" rx="24" fill="url(#bg)"/>
<text x="48" y="64" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="26" font-weight="800" fill="#ffffff">Grouper fish tank mates: bigger than the mouth, tougher than the temper</text>
<text x="48" y="98" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#8aaec2">The rule is simple. If it fits in the mouth, it is food; if it is smaller than the grouper, it is bullied.</text>
<rect x="48" y="150" width="1104" height="54" rx="12" fill="rgba(255,255,255,.1)"/>
<text x="72" y="184" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Lionfish, foxface, rabbitfish</text>
<rect x="406" y="164" width="200" height="26" rx="9" fill="url(#ok)"/>
<text x="422" y="184" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">✓ excellent</text>
<text x="630" y="184" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">spines keep them off the menu</text>
<rect x="48" y="214" width="1104" height="54" rx="12" fill="rgba(255,255,255,.06)"/>
<text x="72" y="248" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Large tangs, angels, wrasses</text>
<rect x="406" y="228" width="200" height="26" rx="9" fill="url(#ok)"/>
<text x="422" y="248" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">✓ good</text>
<text x="630" y="248" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">fast or big; add before the grouper</text>
<rect x="48" y="278" width="1104" height="54" rx="12" fill="rgba(255,255,255,.1)"/>
<text x="72" y="312" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Triggers, large puffers</text>
<rect x="406" y="292" width="200" height="26" rx="9" fill="url(#ok)"/>
<text x="422" y="312" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">~ with care</text>
<text x="630" y="312" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">may bully a small grouper</text>
<rect x="48" y="342" width="1104" height="54" rx="12" fill="rgba(255,255,255,.06)"/>
<text x="72" y="376" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Moray eels, snowflake eels</text>
<rect x="406" y="356" width="200" height="26" rx="9" fill="url(#ok)"/>
<text x="422" y="376" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">✓ good</text>
<text x="630" y="376" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">classic predator tank</text>
<rect x="48" y="406" width="1104" height="54" rx="12" fill="rgba(255,255,255,.1)"/>
<text x="72" y="440" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Clownfish, gobies, damsels</text>
<rect x="406" y="420" width="200" height="26" rx="9" fill="url(#ok)"/>
<text x="422" y="440" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">✗ food</text>
<text x="630" y="440" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">anything under half the grouper&#x27;s length</text>
<rect x="48" y="470" width="1104" height="54" rx="12" fill="rgba(255,255,255,.06)"/>
<text x="72" y="504" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Shrimp, crabs, small fish</text>
<rect x="406" y="484" width="200" height="26" rx="9" fill="url(#ok)"/>
<text x="422" y="504" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">✗ food</text>
<text x="630" y="504" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">groupers hunt inverts at night</text>
<rect x="48" y="534" width="1104" height="54" rx="12" fill="rgba(255,255,255,.1)"/>
<text x="72" y="568" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Another grouper</text>
<rect x="406" y="548" width="200" height="26" rx="9" fill="url(#ok)"/>
<text x="422" y="568" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">✗ / 300+ gal</text>
<text x="630" y="568" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">territorial; different genus only</text>
<text x="1152" y="618" text-anchor="end" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#5f8aa3">fishcareai.com</text>
</svg>