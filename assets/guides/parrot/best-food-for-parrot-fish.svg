<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Best food for parrot fish: what the mouth allows</title>
<desc id="d">Best food for parrot fish: small sinking colour-enhancing cichlid pellets as the staple, frozen bloodworms, brine shrimp and mysis two or three times a week, and soft blanched vegetables; feed twice daily what is eaten in 30 seconds with one fast day a week, and avoid floating pellets, large chunks and feeder fish</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061b2c"/><stop offset="1" stop-color="#0c3d5c"/></linearGradient></defs>
<rect width="1200" height="640" rx="24" fill="url(#bg)"/>
<text x="48" y="64" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#ffffff">Best food for parrot fish: what the mouth allows</text>
<text x="48" y="98" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#8aaec2">The hybrid mouth is a narrow vertical slit that cannot close. Every feeding choice follows from that.</text>
<rect x="48" y="150" width="352" height="172" rx="16" fill="rgba(255,255,255,.07)" stroke="#2bd4c4" stroke-width="2" stroke-opacity=".45"/>
<text x="72" y="190" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="800" fill="#2bd4c4">Staple, daily</text>
<text x="72" y="228" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#e6f0f6">Small sinking cichlid pellets</text>
<text x="72" y="254" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#e6f0f6">with astaxanthin</text>
<rect x="424" y="150" width="352" height="172" rx="16" fill="rgba(255,255,255,.07)" stroke="#27ae60" stroke-width="2" stroke-opacity=".45"/>
<text x="448" y="190" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="800" fill="#27ae60">2-3x a week</text>
<text x="448" y="228" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#e6f0f6">Frozen bloodworms, brine</text>
<text x="448" y="254" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#e6f0f6">shrimp, mysis</text>
<rect x="800" y="150" width="352" height="172" rx="16" fill="rgba(255,255,255,.07)" stroke="#7fc96a" stroke-width="2" stroke-opacity=".45"/>
<text x="824" y="190" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="800" fill="#7fc96a">2x a week</text>
<text x="824" y="228" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#e6f0f6">Blanched peas, spinach,</text>
<text x="824" y="254" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#e6f0f6">courgette</text>
<rect x="48" y="350" width="1104" height="76" rx="14" fill="rgba(255,255,255,.08)"/>
<text x="72" y="382" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#ffffff">How much: twice a day, only what is cleared in 30 seconds · one fast day a week</text>
<text x="72" y="410" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#8aaec2">Sinking is not optional — a parrot cannot snap food from the surface and will gulp air trying.</text>
<rect x="48" y="444" width="1104" height="76" rx="14" fill="rgba(226,87,76,.15)"/>
<text x="72" y="476" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#ffb3ab">Avoid: floating pellets · large chunks · feeder fish · bread and human food</text>
<text x="72" y="504" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#f3cfcb">Feeder fish carry disease and thiaminase; the mouth cannot handle chunks it has to bite.</text>
<text x="48" y="562" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#8aaec2">Colour comes from carotenoids — astaxanthin in the pellet, krill, and the natural pigments in vegetables.</text>
<text x="48" y="590" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#8aaec2">A parrot that stops eating is usually reacting to water quality or temperature, not to the food.</text>
</svg>