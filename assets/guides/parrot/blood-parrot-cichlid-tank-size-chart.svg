<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Parrot fish tank size chart: how many gallons per blood parrot cichlid?</title>
<desc id="d">Planning rule for blood parrot cichlid care: 30 gallons for one adult, 55 to 75 gallons for a pair, 100 gallons or more for a group of three or four. Choose a long tank over a tall one and a filter rated for 1.5 times the volume.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061b2c"/><stop offset="1" stop-color="#0c3d5c"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b6f8f" stop-opacity=".55"/><stop offset="1" stop-color="#0d3550" stop-opacity=".9"/></linearGradient>
<g id="fish"><ellipse cx="0" cy="0" rx="17" ry="13" fill="#ff8a3d"/><path d="M-15,0 L-27,-9 L-24,0 L-27,9 Z" fill="#ff8a3d"/><circle cx="8" cy="-4" r="3.2" fill="#fff"/><circle cx="9" cy="-4" r="1.6" fill="#1a2b3c"/><path d="M14,1 q4,2 0,5" stroke="#1a2b3c" stroke-width="1.6" fill="none"/></g></defs>
<rect width="1200" height="640" rx="24" fill="url(#bg)"/>
<text x="48" y="64" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#ffffff">Parrot fish tank size: how many gallons per blood parrot cichlid?</text>
<text x="48" y="98" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#8aaec2">30 gallons for the first adult, 55&#8211;75 for a pair, 100+ for a group. A long footprint matters more than height for this poor swimmer.</text>
<!-- tank 1 -->
<rect x="48" y="300" width="200" height="170" rx="10" fill="url(#water)" stroke="#3e8cb4" stroke-opacity=".6" stroke-width="2"/>
<rect x="48" y="300" width="200" height="14" rx="6" fill="#2bd4c4" opacity=".18"/>
<use href="#fish" transform="translate(148,385) scale(1.6)"/>
<text x="148" y="240" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="46" font-weight="800" fill="#2bd4c4">30 gal</text>
<text x="148" y="272" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#c9dde8">1 blood parrot</text>
<text x="148" y="504" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#8aaec2">36 in / 90 cm long minimum</text>
<!-- tank 2 -->
<rect x="318" y="290" width="330" height="180" rx="10" fill="url(#water)" stroke="#3e8cb4" stroke-opacity=".6" stroke-width="2"/>
<rect x="318" y="290" width="330" height="14" rx="6" fill="#2bd4c4" opacity=".18"/>
<use href="#fish" transform="translate(420,380) scale(1.6)"/><use href="#fish" transform="translate(545,395) scale(1.6) scale(-1,1)"/>
<text x="483" y="240" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="46" font-weight="800" fill="#2bd4c4">55&#8211;75 gal</text>
<text x="483" y="272" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#c9dde8">A pair</text>
<text x="483" y="504" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#8aaec2">48 in / 120 cm long, caves for both fish</text>
<!-- tank 3 -->
<rect x="718" y="280" width="434" height="190" rx="10" fill="url(#water)" stroke="#3e8cb4" stroke-opacity=".6" stroke-width="2"/>
<rect x="718" y="280" width="434" height="14" rx="6" fill="#2bd4c4" opacity=".18"/>
<use href="#fish" transform="translate(800,370) scale(1.6)"/><use href="#fish" transform="translate(905,400) scale(1.6) scale(-1,1)"/><use href="#fish" transform="translate(1000,360) scale(1.6)"/><use href="#fish" transform="translate(1085,405) scale(1.6) scale(-1,1)"/>
<text x="935" y="240" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="46" font-weight="800" fill="#2bd4c4">100+ gal</text>
<text x="935" y="272" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#c9dde8">Group of 3&#8211;4 or a cichlid community</text>
<text x="935" y="504" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#8aaec2">60 in / 150 cm long, 125 gal if adding oscars</text>
<!-- rule strip -->
<rect x="48" y="540" width="1104" height="60" rx="12" fill="#ffffff" fill-opacity=".06" stroke="#3e8cb4" stroke-opacity=".35"/>
<text x="72" y="577" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="18" fill="#e8f3f9"><tspan font-weight="800" fill="#2bd4c4">Rule:</tspan> filter rated for 1.5&#215; the tank volume, baffle strong outflows, sand or smooth gravel, and add caves before the fish goes in.</text>
<text x="1152" y="626" text-anchor="end" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#5f8299">fishcareai.com &#183; blood parrot cichlid care</text>
</svg>
