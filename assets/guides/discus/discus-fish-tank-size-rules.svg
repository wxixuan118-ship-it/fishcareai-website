<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t2 d2">
<title id="t2">Discus fish tank size rules: 55–75 gallons for a group of 4–6, 10 gallons per extra adult, 82–88°F water with heavy filtration</title>
<desc id="d2">Three panels: six discus next to a 55 to 75 gallon block; one discus next to a 10 gallon block; a thermometer reading 82 to 88 degrees with a filter icon.</desc>
<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061b2c"/><stop offset="1" stop-color="#0c3d5c"/></linearGradient></defs>
<rect width="1200" height="420" rx="24" fill="url(#bg2)"/>
<rect x="40" y="40" width="360" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="66" y="86" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">A group of 4–6 first</text>
<text x="66" y="112" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#8aaec2">Discus shoal; pairs and trios end with one bullied fish.</text>
<g transform="translate(40,0)"><g transform="translate(70.0,205.0) scale(1.25,1.25)"><path d="M-10,0 L-15,-4 L-14,0 L-15,4 Z" fill="#2bd4c4" opacity=".8"/><circle cx="0" cy="0" r="10" fill="#2bd4c4"/><path d="M-5,-8 V8 M0,-10 V10 M5,-8 V8" stroke="#061b2c" stroke-width="1" opacity=".35"/><circle cx="7" cy="-2" r="1.3" fill="#061b2c"/></g><g transform="translate(108.0,205.0) scale(1.25,1.25)"><path d="M-10,0 L-15,-4 L-14,0 L-15,4 Z" fill="#f4a23e" opacity=".8"/><circle cx="0" cy="0" r="10" fill="#f4a23e"/><path d="M-5,-8 V8 M0,-10 V10 M5,-8 V8" stroke="#061b2c" stroke-width="1" opacity=".35"/><circle cx="7" cy="-2" r="1.3" fill="#061b2c"/></g><g transform="translate(146.0,205.0) scale(1.25,1.25)"><path d="M-10,0 L-15,-4 L-14,0 L-15,4 Z" fill="#5b7efc" opacity=".8"/><circle cx="0" cy="0" r="10" fill="#5b7efc"/><path d="M-5,-8 V8 M0,-10 V10 M5,-8 V8" stroke="#061b2c" stroke-width="1" opacity=".35"/><circle cx="7" cy="-2" r="1.3" fill="#061b2c"/></g><g transform="translate(70.0,245.0) scale(1.25,1.25)"><path d="M-10,0 L-15,-4 L-14,0 L-15,4 Z" fill="#ff7a9e" opacity=".8"/><circle cx="0" cy="0" r="10" fill="#ff7a9e"/><path d="M-5,-8 V8 M0,-10 V10 M5,-8 V8" stroke="#061b2c" stroke-width="1" opacity=".35"/><circle cx="7" cy="-2" r="1.3" fill="#061b2c"/></g><g transform="translate(108.0,245.0) scale(1.25,1.25)"><path d="M-10,0 L-15,-4 L-14,0 L-15,4 Z" fill="#7ee081" opacity=".8"/><circle cx="0" cy="0" r="10" fill="#7ee081"/><path d="M-5,-8 V8 M0,-10 V10 M5,-8 V8" stroke="#061b2c" stroke-width="1" opacity=".35"/><circle cx="7" cy="-2" r="1.3" fill="#061b2c"/></g><g transform="translate(146.0,245.0) scale(1.25,1.25)"><path d="M-10,0 L-15,-4 L-14,0 L-15,4 Z" fill="#c88bff" opacity=".8"/><circle cx="0" cy="0" r="10" fill="#c88bff"/><path d="M-5,-8 V8 M0,-10 V10 M5,-8 V8" stroke="#061b2c" stroke-width="1" opacity=".35"/><circle cx="7" cy="-2" r="1.3" fill="#061b2c"/></g><text x="190" y="236" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="34" font-weight="800" fill="#fff">=</text><rect x="230" y="170" width="105" height="110" rx="12" fill="#1b6f8f" opacity=".55" stroke="#2bd4c4" stroke-width="2"/><text x="282.5" y="227.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#fff">55</text><text x="282.5" y="249.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8aaec2">75 recommended</text></g>
<text x="66" y="352" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#dff0fa">The tool will not size a tank for fewer than four.</text>
<rect x="420" y="40" width="360" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="446" y="86" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">Then 10 per adult</text>
<text x="446" y="112" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#8aaec2">Extra fish add waste load, not new territory.</text>
<g transform="translate(420,0)"><g transform="translate(100.0,225.0) scale(2.6,2.6)"><path d="M-10,0 L-15,-4 L-14,0 L-15,4 Z" fill="#f4a23e" opacity=".8"/><circle cx="0" cy="0" r="10" fill="#f4a23e"/><path d="M-5,-8 V8 M0,-10 V10 M5,-8 V8" stroke="#061b2c" stroke-width="1" opacity=".35"/><circle cx="7" cy="-2" r="1.3" fill="#061b2c"/></g><text x="160" y="236" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="34" font-weight="800" fill="#fff">=</text><rect x="210" y="170" width="120" height="110" rx="12" fill="#1b6f8f" opacity=".55" stroke="#2bd4c4" stroke-width="2"/><text x="270.0" y="227.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#fff">+10</text><text x="270.0" y="249.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8aaec2">gallons</text></g>
<text x="446" y="352" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#dff0fa">8 discus → 75–95 gal · 12 discus → 115–135 gal</text>
<rect x="800" y="40" width="360" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="826" y="86" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">Warm water, big filter</text>
<text x="826" y="112" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#8aaec2">At 82–88°F waste breaks down fast and oxygen runs low.</text>
<g transform="translate(800,0)"><rect x="70" y="165" width="110" height="120" rx="12" fill="#1b6f8f" opacity=".55" stroke="#2bd4c4" stroke-width="2"/><text x="125.0" y="227.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#fff">82–88</text><text x="125.0" y="249.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8aaec2">°F · 28–31°C</text><text x="200" y="215" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">Filter 2×</text><text x="200" y="245" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">the volume,</text><text x="200" y="275" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">50% weekly</text></g>
<text x="826" y="352" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#dff0fa">Wide 48×18 footprint beats a tall tank.</text>
</svg>