<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Tang fish breeding: why it almost never happens at home</title>
<desc id="d">Tang fish breeding chart: no visible sex difference, dusk spawning in open water, floating eggs hatching in 24 to 30 hours, a 60 to 80 day larval stage, first captive-bred yellow tang in 2015 and blue tang in 2016</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061b2c"/><stop offset="1" stop-color="#0c3d5c"/></linearGradient><linearGradient id="ok" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2bd4c4"/><stop offset="1" stop-color="#27ae60"/></linearGradient></defs>
<rect width="1200" height="640" rx="24" fill="url(#bg)"/>
<text x="48" y="64" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#ffffff">Tang fish breeding: why it almost never happens at home</text>
<text x="48" y="98" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#8aaec2">Pelagic spawners with a 2–3 month larval stage. Sexing, spawning and what captive breeding took.</text>
<rect x="48" y="150" width="1104" height="58" rx="12" fill="rgba(255,255,255,.1)"/>
<text x="72" y="186" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Sexing</text>
<rect x="420" y="164" width="330" height="30" rx="9" fill="url(#ok)"/>
<text x="436" y="186" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">no visible difference</text>
<text x="780" y="186" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">males larger; naso males grow tail streamers</text>
<rect x="48" y="218" width="1104" height="58" rx="12" fill="rgba(255,255,255,.06)"/>
<text x="72" y="254" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Spawning</text>
<rect x="420" y="232" width="330" height="30" rx="9" fill="url(#ok)"/>
<text x="436" y="254" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">at dusk, in open water</text>
<text x="780" y="254" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">pairs or groups rise and release eggs</text>
<rect x="48" y="286" width="1104" height="58" rx="12" fill="rgba(255,255,255,.1)"/>
<text x="72" y="322" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Eggs</text>
<rect x="420" y="300" width="330" height="30" rx="9" fill="url(#ok)"/>
<text x="436" y="322" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">~0.7 mm, floating</text>
<text x="780" y="322" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">hatch in 24–30 hours</text>
<rect x="48" y="354" width="1104" height="58" rx="12" fill="rgba(255,255,255,.06)"/>
<text x="72" y="390" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Larvae</text>
<rect x="420" y="368" width="330" height="30" rx="9" fill="url(#ok)"/>
<text x="436" y="390" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">60–80 days pelagic</text>
<text x="780" y="390" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">need live copepods, then rotifers</text>
<rect x="48" y="422" width="1104" height="58" rx="12" fill="rgba(255,255,255,.1)"/>
<text x="72" y="458" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">First captive yellow tang</text>
<rect x="420" y="436" width="330" height="30" rx="9" fill="url(#ok)"/>
<text x="436" y="458" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">2015, Hawaii</text>
<text x="780" y="458" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">Oceanic Institute, 5+ years of work</text>
<rect x="48" y="490" width="1104" height="58" rx="12" fill="rgba(255,255,255,.06)"/>
<text x="72" y="526" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">First captive blue tang</text>
<rect x="420" y="504" width="330" height="30" rx="9" fill="url(#ok)"/>
<text x="436" y="526" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">2016, Florida</text>
<text x="780" y="526" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">UF Tropical Aquaculture Lab</text>
<text x="48" y="600" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#8aaec2">No home aquarium has raised tang larvae. A pregnant-looking tang is a well-fed or bloated tang.</text>
<text x="1152" y="618" text-anchor="end" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#5f8aa3">fishcareai.com</text>
</svg>