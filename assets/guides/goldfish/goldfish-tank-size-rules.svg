<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t2 d2">
<title id="t2">Goldfish tank size rules: 20 gallons for a fancy goldfish, 40 for a single-tail, 10 gallons per extra fish, no bowls</title>
<desc id="d2">Three panels: a round fancy goldfish next to a 20 gallon block and a long comet next to a 40 gallon block; one goldfish next to a 10 gallon block; a fish bowl inside a no symbol.</desc>
<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061b2c"/><stop offset="1" stop-color="#0c3d5c"/></linearGradient></defs>
<rect width="1200" height="420" rx="24" fill="url(#bg2)"/>
<rect x="40" y="40" width="360" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="66" y="86" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">Fancy 20 · single-tail 40</text>
<text x="66" y="112" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#8aaec2">Orandas and ranchus stay 6–8 in; comets reach 10–14 in.</text>
<g transform="translate(40,0)"><g transform="translate(80.0,195.0) scale(1.8,1.8)"><path d="M-8,0 Q-14,-9 -20,-6 Q-15,0 -20,6 Q-14,9 -8,0 Z" fill="#f4a23e" opacity=".8"/><path d="M-3,-5 Q1,-10 5,-5 Z" fill="#f4a23e" opacity=".7"/><ellipse cx="0" cy="0" rx="9" ry="6" fill="#f4a23e"/><circle cx="6" cy="-1.5" r="1.4" fill="#061b2c"/></g><text x="120" y="205" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="34" font-weight="800" fill="#fff">=</text><rect x="160" y="165" width="80" height="75" rx="12" fill="#1b6f8f" opacity=".55" stroke="#2bd4c4" stroke-width="2"/><text x="200.0" y="204.5" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#fff">20</text><text x="200.0" y="226.5" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8aaec2">gal</text><g transform="translate(80.0,290.0) scale(1.8,1.8)"><path d="M-8,0 Q-14,-9 -20,-6 Q-15,0 -20,6 Q-14,9 -8,0 Z" fill="#ff7a9e" opacity=".8"/><path d="M-3,-5 Q1,-10 5,-5 Z" fill="#ff7a9e" opacity=".7"/><ellipse cx="0" cy="0" rx="9" ry="6" fill="#ff7a9e"/><circle cx="6" cy="-1.5" r="1.4" fill="#061b2c"/></g><text x="120" y="300" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="34" font-weight="800" fill="#fff">=</text><rect x="160" y="262" width="80" height="75" rx="12" fill="#1b6f8f" opacity=".55" stroke="#2bd4c4" stroke-width="2"/><text x="200.0" y="301.5" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#fff">40</text><text x="200.0" y="323.5" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8aaec2">gal</text><text x="255" y="210" text-anchor="start" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#8aaec2">fancy</text><text x="255" y="305" text-anchor="start" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#8aaec2">single-tail</text></g>
<text x="66" y="352" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#dff0fa">Never mix the two types in one tank.</text>
<rect x="420" y="40" width="360" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="446" y="86" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">Then 10 per fish</text>
<text x="446" y="112" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#8aaec2">Each extra goldfish adds about 10 gallons.</text>
<g transform="translate(420,0)"><g transform="translate(100.0,225.0) scale(2.6,2.6)"><path d="M-8,0 Q-14,-9 -20,-6 Q-15,0 -20,6 Q-14,9 -8,0 Z" fill="#2bd4c4" opacity=".8"/><path d="M-3,-5 Q1,-10 5,-5 Z" fill="#2bd4c4" opacity=".7"/><ellipse cx="0" cy="0" rx="9" ry="6" fill="#2bd4c4"/><circle cx="6" cy="-1.5" r="1.4" fill="#061b2c"/></g><text x="160" y="236" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="34" font-weight="800" fill="#fff">=</text><rect x="210" y="170" width="120" height="110" rx="12" fill="#1b6f8f" opacity=".55" stroke="#2bd4c4" stroke-width="2"/><text x="270.0" y="227.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#fff">+10</text><text x="270.0" y="249.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8aaec2">gallons</text></g>
<text x="446" y="352" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#dff0fa">4 fancies → 50 gal · 3 comets → 60 gal</text>
<rect x="800" y="40" width="360" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="826" y="86" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">No bowls, ever</text>
<text x="826" y="112" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#8aaec2">No filter, no heater control, no room to grow.</text>
<g transform="translate(800,0)"><path d="M110,175 q-30,55 0,100 q40,20 80,0 q30,-45 0,-100 Z" fill="#1b6f8f" opacity=".45" stroke="#2bd4c4" stroke-width="2"/><g transform="translate(150.0,230.0) scale(1.5,1.5)"><path d="M-8,0 Q-14,-9 -20,-6 Q-15,0 -20,6 Q-14,9 -8,0 Z" fill="#f4a23e" opacity=".8"/><path d="M-3,-5 Q1,-10 5,-5 Z" fill="#f4a23e" opacity=".7"/><ellipse cx="0" cy="0" rx="9" ry="6" fill="#f4a23e"/><circle cx="6" cy="-1.5" r="1.4" fill="#061b2c"/></g><circle cx="150" cy="225" r="78" fill="none" stroke="#ff7a9e" stroke-width="5"/><path d="M95.4,170.4 L204.6,279.6" stroke="#ff7a9e" stroke-width="5"/></g>
<text x="826" y="352" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#dff0fa">A bowl fish lives months; a tank fish lives 15–25 years.</text>
</svg>