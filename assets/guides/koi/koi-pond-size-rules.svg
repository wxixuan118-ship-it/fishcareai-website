<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t2 d2">
<title id="t2">Koi pond size rules: 250–500 gallons per koi, 1,000 gallon minimum pond, at least 3 feet deep</title>
<desc id="d2">Three panels: one koi next to a 250 to 500 gallon block; a pond outline labelled 1,000 gallons minimum; a pond cross-section with a 3 foot depth marker.</desc>
<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061b2c"/><stop offset="1" stop-color="#0c3d5c"/></linearGradient></defs>
<rect width="1200" height="420" rx="24" fill="url(#bg2)"/>
<rect x="40" y="40" width="360" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="66" y="86" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">250–500 gal per koi</text>
<text x="66" y="112" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#8aaec2">500 is comfortable; 250 is the ceiling with heavy filtration.</text>
<g transform="translate(40,0)"><g transform="translate(100.0,225.0) scale(2.6,2.6)"><path d="M-18,0 L-12,-5 L-11,0 L-12,5 Z" fill="#f4a23e" opacity=".85"/><ellipse cx="0" cy="0" rx="14" ry="5" fill="#f3f4f6"/><ellipse cx="-3" cy="-1" rx="4" ry="2.5" fill="#f4a23e"/><ellipse cx="7" cy="1" rx="3" ry="2" fill="#f4a23e"/><circle cx="11" cy="-1" r="1.1" fill="#061b2c"/></g><text x="170" y="236" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="34" font-weight="800" fill="#fff">=</text><rect x="210" y="170" width="125" height="110" rx="12" fill="#1b6f8f" opacity=".55" stroke="#2bd4c4" stroke-width="2"/><text x="272.5" y="227.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#fff">500</text><text x="272.5" y="249.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8aaec2">250 minimum</text></g>
<text x="66" y="352" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#dff0fa">4 koi → 2,000 gal recommended, 1,000 minimum.</text>
<rect x="420" y="40" width="360" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="446" y="86" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">1,000 gal floor</text>
<text x="446" y="112" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#8aaec2">Smaller ponds swing in temperature and crash in summer.</text>
<g transform="translate(420,0)"><rect x="60" y="180" width="270" height="90" rx="45" fill="#1b6f8f" opacity=".45" stroke="#2bd4c4" stroke-width="2"/><g transform="translate(110.0,214.0) scale(1.3,1.3)"><path d="M-18,0 L-12,-5 L-11,0 L-12,5 Z" fill="#2bd4c4" opacity=".85"/><ellipse cx="0" cy="0" rx="14" ry="5" fill="#f3f4f6"/><ellipse cx="-3" cy="-1" rx="4" ry="2.5" fill="#2bd4c4"/><ellipse cx="7" cy="1" rx="3" ry="2" fill="#2bd4c4"/><circle cx="11" cy="-1" r="1.1" fill="#061b2c"/></g><g transform="translate(165.0,232.0) scale(1.3,1.3)"><path d="M-18,0 L-12,-5 L-11,0 L-12,5 Z" fill="#f4a23e" opacity=".85"/><ellipse cx="0" cy="0" rx="14" ry="5" fill="#f3f4f6"/><ellipse cx="-3" cy="-1" rx="4" ry="2.5" fill="#f4a23e"/><ellipse cx="7" cy="1" rx="3" ry="2" fill="#f4a23e"/><circle cx="11" cy="-1" r="1.1" fill="#061b2c"/></g><g transform="translate(220.0,214.0) scale(-1.3,1.3)"><path d="M-18,0 L-12,-5 L-11,0 L-12,5 Z" fill="#5b7efc" opacity=".85"/><ellipse cx="0" cy="0" rx="14" ry="5" fill="#f3f4f6"/><ellipse cx="-3" cy="-1" rx="4" ry="2.5" fill="#5b7efc"/><ellipse cx="7" cy="1" rx="3" ry="2" fill="#5b7efc"/><circle cx="11" cy="-1" r="1.1" fill="#061b2c"/></g><g transform="translate(275.0,232.0) scale(1.3,1.3)"><path d="M-18,0 L-12,-5 L-11,0 L-12,5 Z" fill="#ff7a9e" opacity=".85"/><ellipse cx="0" cy="0" rx="14" ry="5" fill="#f3f4f6"/><ellipse cx="-3" cy="-1" rx="4" ry="2.5" fill="#ff7a9e"/><ellipse cx="7" cy="1" rx="3" ry="2" fill="#ff7a9e"/><circle cx="11" cy="-1" r="1.1" fill="#061b2c"/></g><text x="195" y="300" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#2bd4c4">1,000 gal · 3–4 koi starter</text></g>
<text x="446" y="352" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#dff0fa">2,000–5,000 gallons is far easier to keep stable.</text>
<rect x="800" y="40" width="360" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="826" y="86" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">3 feet deep</text>
<text x="826" y="112" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#8aaec2">Depth buffers heat, lets koi overwinter and foils herons.</text>
<g transform="translate(800,0)"><path d="M60,175 H330 V265 Q195,300 60,265 Z" fill="#1b6f8f" opacity=".45" stroke="#2bd4c4" stroke-width="2"/><g transform="translate(200.0,250.0) scale(1.6,1.6)"><path d="M-18,0 L-12,-5 L-11,0 L-12,5 Z" fill="#f4a23e" opacity=".85"/><ellipse cx="0" cy="0" rx="14" ry="5" fill="#f3f4f6"/><ellipse cx="-3" cy="-1" rx="4" ry="2.5" fill="#f4a23e"/><ellipse cx="7" cy="1" rx="3" ry="2" fill="#f4a23e"/><circle cx="11" cy="-1" r="1.1" fill="#061b2c"/></g><path d="M345,175 V285" stroke="#2bd4c4" stroke-width="2"/><path d="M339,175 H351 M339,285 H351" stroke="#2bd4c4" stroke-width="2"/><text x="357" y="235.0" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#2bd4c4">3 ft+</text></g>
<text x="826" y="352" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#dff0fa">4–5 feet preferred in cold climates.</text>
</svg>