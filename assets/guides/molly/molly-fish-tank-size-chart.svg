<text x="48" y="98" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#8aaec2">Planning rule: 4 US gallons per adult molly, minimum group of 5, 20 gallons to start. Sailfins: 30 gallons or more.</text>
