<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t2 d2">
<title id="t2">Angelfish tank size rules: 18 inches of water height, 29–40 gallons for a pair, 10 gallons per extra fish</title>
<desc id="d2">Three panels: a tall tank with an 18-inch height marker; a pair of angelfish next to a 29 to 40 gallon block; one angelfish next to a 10 gallon block.</desc>
<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061b2c"/><stop offset="1" stop-color="#0c3d5c"/></linearGradient></defs>
<rect width="1200" height="420" rx="24" fill="url(#bg2)"/>
<rect x="40" y="40" width="360" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="66" y="86" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">Height first</text>
<text x="66" y="112" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#8aaec2">Adults reach 10 inches tall; 18 inches of water is the floor.</text>
<g transform="translate(40,0)"><rect x="60" y="150" width="150" height="150" rx="8" fill="#1b6f8f" opacity=".45" stroke="#2bd4c4" stroke-width="2"/><g transform="translate(135.0,225.0) scale(2.4,2.4)"><path d="M-9,0 L-15,-5 L-14,0 L-15,5 Z" fill="#2bd4c4" opacity=".8"/><path d="M-2,-6 L4,-18 L8,-6 Z" fill="#2bd4c4" opacity=".75"/><path d="M-2,6 L4,18 L8,6 Z" fill="#2bd4c4" opacity=".75"/><path d="M-9,0 L2,-8 L10,0 L2,8 Z" fill="#2bd4c4"/><path d="M-3,-4 V4 M3,-5 V5" stroke="#061b2c" stroke-width="1.2" opacity=".5"/><circle cx="6" cy="-1.5" r="1.2" fill="#061b2c"/></g><path d="M230,150 V300" stroke="#2bd4c4" stroke-width="2"/><path d="M224,150 H236 M224,300 H236" stroke="#2bd4c4" stroke-width="2"/><text x="242" y="230.0" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#2bd4c4">18 in+</text></g>
<text x="66" y="352" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#dff0fa">29 gal, 40 breeder or tall 55 all qualify.</text>
<rect x="420" y="40" width="360" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="446" y="86" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">A pair to start</text>
<text x="446" y="112" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#8aaec2">The first two fish carry most of the volume.</text>
<g transform="translate(420,0)"><g transform="translate(80.0,225.0) scale(1.9,1.9)"><path d="M-9,0 L-15,-5 L-14,0 L-15,5 Z" fill="#2bd4c4" opacity=".8"/><path d="M-2,-6 L4,-18 L8,-6 Z" fill="#2bd4c4" opacity=".75"/><path d="M-2,6 L4,18 L8,6 Z" fill="#2bd4c4" opacity=".75"/><path d="M-9,0 L2,-8 L10,0 L2,8 Z" fill="#2bd4c4"/><path d="M-3,-4 V4 M3,-5 V5" stroke="#061b2c" stroke-width="1.2" opacity=".5"/><circle cx="6" cy="-1.5" r="1.2" fill="#061b2c"/></g><g transform="translate(130.0,225.0) scale(-1.9,1.9)"><path d="M-9,0 L-15,-5 L-14,0 L-15,5 Z" fill="#f4a23e" opacity=".8"/><path d="M-2,-6 L4,-18 L8,-6 Z" fill="#f4a23e" opacity=".75"/><path d="M-2,6 L4,18 L8,6 Z" fill="#f4a23e" opacity=".75"/><path d="M-9,0 L2,-8 L10,0 L2,8 Z" fill="#f4a23e"/><path d="M-3,-4 V4 M3,-5 V5" stroke="#061b2c" stroke-width="1.2" opacity=".5"/><circle cx="6" cy="-1.5" r="1.2" fill="#061b2c"/></g><text x="175" y="236" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="34" font-weight="800" fill="#fff">=</text><rect x="215" y="170" width="120" height="110" rx="12" fill="#1b6f8f" opacity=".55" stroke="#2bd4c4" stroke-width="2"/><text x="275.0" y="227.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#fff">29–40</text><text x="275.0" y="249.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8aaec2">gallons</text></g>
<text x="446" y="352" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#dff0fa">A breeding pair should have a 40 to itself.</text>
<rect x="800" y="40" width="360" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="826" y="86" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">Then 10 per fish</text>
<text x="826" y="112" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#8aaec2">Every angelfish after the pair adds about 10 gallons.</text>
<g transform="translate(800,0)"><g transform="translate(100.0,225.0) scale(2.4,2.4)"><path d="M-9,0 L-15,-5 L-14,0 L-15,5 Z" fill="#5b7efc" opacity=".8"/><path d="M-2,-6 L4,-18 L8,-6 Z" fill="#5b7efc" opacity=".75"/><path d="M-2,6 L4,18 L8,6 Z" fill="#5b7efc" opacity=".75"/><path d="M-9,0 L2,-8 L10,0 L2,8 Z" fill="#5b7efc"/><path d="M-3,-4 V4 M3,-5 V5" stroke="#061b2c" stroke-width="1.2" opacity=".5"/><circle cx="6" cy="-1.5" r="1.2" fill="#061b2c"/></g><text x="160" y="236" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="34" font-weight="800" fill="#fff">=</text><rect x="210" y="170" width="120" height="110" rx="12" fill="#1b6f8f" opacity=".55" stroke="#2bd4c4" stroke-width="2"/><text x="270.0" y="227.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#fff">+10</text><text x="270.0" y="249.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8aaec2">gallons</text></g>
<text x="826" y="352" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#dff0fa">5–6 fish → 55–75 gal · 8 fish → 90 gal</text>
</svg>