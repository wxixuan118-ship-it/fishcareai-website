<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t2 d2">
<title id="t2">Oscar fish tank size rules: 75 gallons for one oscar, 125–150 for two, filter rated for twice the tank</title>
<desc id="d2">Three panels: one oscar next to a 75 gallon block; two oscars next to a 125 to 150 gallon block; a filter icon labelled 2x.</desc>
<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061b2c"/><stop offset="1" stop-color="#0c3d5c"/></linearGradient></defs>
<rect width="1200" height="420" rx="24" fill="url(#bg2)"/>
<rect x="40" y="40" width="360" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="66" y="86" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">One oscar, 75 gal</text>
<text x="66" y="112" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#8aaec2">A 12–14 inch adult needs a 4-foot tank to turn around.</text>
<g transform="translate(40,0)"><g transform="translate(100.0,225.0) scale(3.0,3.0)"><path d="M-16,0 L-11,-6 L-10,0 L-11,6 Z" fill="#f4a23e" opacity=".85"/><path d="M-6,-5 Q0,-10 8,-5 Z" fill="#f4a23e" opacity=".7"/><ellipse cx="2" cy="0" rx="12" ry="6.5" fill="#f4a23e"/><circle cx="-9" cy="-1" r="2" fill="#f4a23e" stroke="#061b2c" stroke-width=".8"/><circle cx="10" cy="-1.5" r="1.4" fill="#061b2c"/></g><text x="160" y="236" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="34" font-weight="800" fill="#fff">=</text><rect x="210" y="170" width="120" height="110" rx="12" fill="#1b6f8f" opacity=".55" stroke="#2bd4c4" stroke-width="2"/><text x="270.0" y="227.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#fff">75</text><text x="270.0" y="249.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8aaec2">gal min · 100 rec</text></g>
<text x="66" y="352" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#dff0fa">Buy the adult tank on day one; they grow 1 in/month.</text>
<rect x="420" y="40" width="360" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="446" y="86" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">Two oscars, 125–150</text>
<text x="446" y="112" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#8aaec2">Only a bonded pair or two raised together.</text>
<g transform="translate(420,0)"><g transform="translate(80.0,210.0) scale(2.2,2.2)"><path d="M-16,0 L-11,-6 L-10,0 L-11,6 Z" fill="#f4a23e" opacity=".85"/><path d="M-6,-5 Q0,-10 8,-5 Z" fill="#f4a23e" opacity=".7"/><ellipse cx="2" cy="0" rx="12" ry="6.5" fill="#f4a23e"/><circle cx="-9" cy="-1" r="2" fill="#f4a23e" stroke="#061b2c" stroke-width=".8"/><circle cx="10" cy="-1.5" r="1.4" fill="#061b2c"/></g><g transform="translate(135.0,245.0) scale(-2.2,2.2)"><path d="M-16,0 L-11,-6 L-10,0 L-11,6 Z" fill="#2bd4c4" opacity=".85"/><path d="M-6,-5 Q0,-10 8,-5 Z" fill="#2bd4c4" opacity=".7"/><ellipse cx="2" cy="0" rx="12" ry="6.5" fill="#2bd4c4"/><circle cx="-9" cy="-1" r="2" fill="#f4a23e" stroke="#061b2c" stroke-width=".8"/><circle cx="10" cy="-1.5" r="1.4" fill="#061b2c"/></g><text x="180" y="236" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="34" font-weight="800" fill="#fff">=</text><rect x="220" y="170" width="115" height="110" rx="12" fill="#1b6f8f" opacity=".55" stroke="#2bd4c4" stroke-width="2"/><text x="277.5" y="227.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#fff">125</text><text x="277.5" y="249.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8aaec2">to 150 gal</text></g>
<text x="446" y="352" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#dff0fa">Three oscars need 180 gallons or more.</text>
<rect x="800" y="40" width="360" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="826" y="86" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">Filter for 2x the tank</text>
<text x="826" y="112" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#8aaec2">Oscars are the messiest common aquarium fish.</text>
<g transform="translate(800,0)"><rect x="70" y="165" width="110" height="120" rx="12" fill="#1b6f8f" opacity=".55" stroke="#2bd4c4" stroke-width="2"/><text x="125.0" y="227.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#fff">2×</text><text x="125.0" y="249.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8aaec2">tank volume</text><text x="200" y="215" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">+ 25–30%</text><text x="200" y="245" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">weekly</text><text x="200" y="275" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">water change</text></g>
<text x="826" y="352" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#dff0fa">A canister rated 150+ gal on a 75-gal tank.</text>
</svg>