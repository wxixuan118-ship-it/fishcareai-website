<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Male vs female oscar fish: what venting shows</title>
<desc id="d">Male vs female oscar fish venting comparison: the female genital papilla is broad, blunt and rounded, the male papilla is narrower and pointed; body size, fin shape, colour intensity and dorsal spots do not sex an oscar</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061b2c"/><stop offset="1" stop-color="#0c3d5c"/></linearGradient></defs>
<rect width="1200" height="640" rx="24" fill="url(#bg)"/>
<text x="48" y="64" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#ffffff">Male vs female oscar fish: what venting shows</text>
<text x="48" y="98" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#8aaec2">Two openings on the underside. The rear one is the vent; the papilla in front of it is what you are reading.</text>
<rect x="48" y="140" width="520" height="300" rx="16" fill="rgba(255,255,255,.07)"/>
<text x="76" y="180" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#2bd4c4">Female</text>
<text x="76" y="208" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#8aaec2">Lays the eggs — the only certain test</text>
<path d="M 108 400 Q 308 250 508 400" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
<ellipse cx="253" cy="336" rx="13" ry="10" fill="#0a2a3d" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
<text x="253" y="378" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#8aaec2" text-anchor="middle">vent</text>
<path d="M 330 346 Q 330 304 364 304 Q 398 304 398 346 Z" fill="#2bd4c4" opacity=".92"/>
<text x="364" y="378" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#8aaec2" text-anchor="middle">papilla</text>
<text x="76" y="412" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#cfe2ee">Broad, blunt, rounded tip</text>
<rect x="632" y="140" width="520" height="300" rx="16" fill="rgba(255,255,255,.07)"/>
<text x="660" y="180" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#f0b429">Male</text>
<text x="660" y="208" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#8aaec2">Fertilises after the pass</text>
<path d="M 692 400 Q 892 250 1092 400" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
<ellipse cx="837" cy="336" rx="13" ry="10" fill="#0a2a3d" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
<text x="837" y="378" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#8aaec2" text-anchor="middle">vent</text>
<path d="M 928 346 Q 930 300 948 290 Q 966 300 968 346 Z" fill="#f0b429" opacity=".92"/>
<text x="948" y="378" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#8aaec2" text-anchor="middle">papilla</text>
<text x="660" y="412" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#cfe2ee">Narrower, tapering to a point</text>
<rect x="48" y="470" width="1104" height="54" rx="12" fill="rgba(226,87,76,.16)"/>
<text x="72" y="504" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="600" fill="#ffb3ab">Does not work: body size &#183; fin length or shape &#183; colour intensity &#183; dark spots on the dorsal fin</text>
<text x="48" y="568" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#8aaec2">Needs a fish over about 10 inches or twelve months old, and two fish compared side by side rather than one judged alone.</text>
<text x="48" y="596" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#8aaec2">Shapes are schematic: real papillae are small, and the difference is clearer in person than in any drawing.</text>
</svg>