<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Oscar fish lifespan: what the tank decides</title>
<desc id="d">Oscar fish lifespan by keeping condition: 18 to 20 years with exceptional care, 12 to 15 years when well kept in 75 to 125 gallons with nitrate under 20 ppm, 8 to 12 years in an average home aquarium, 8 to 10 years in the wild, and only 3 to 6 years in an undersized tank or on a poor diet</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061b2c"/><stop offset="1" stop-color="#0c3d5c"/></linearGradient></defs>
<rect width="1200" height="640" rx="24" fill="url(#bg)"/>
<text x="48" y="64" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#ffffff">Oscar fish lifespan: what the tank decides</text>
<text x="48" y="98" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#8aaec2">Same fish, same species. The spread between the top bar and the bottom one is husbandry, not luck.</text>
<line x1="430" y1="150" x2="430" y2="556" stroke="rgba(255,255,255,.13)" stroke-width="1"/>
<text x="430" y="584" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#8aaec2" text-anchor="middle">0 yr</text>
<line x1="602" y1="150" x2="602" y2="556" stroke="rgba(255,255,255,.13)" stroke-width="1"/>
<text x="602" y="584" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#8aaec2" text-anchor="middle">5 yr</text>
<line x1="775" y1="150" x2="775" y2="556" stroke="rgba(255,255,255,.13)" stroke-width="1"/>
<text x="775" y="584" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#8aaec2" text-anchor="middle">10 yr</text>
<line x1="948" y1="150" x2="948" y2="556" stroke="rgba(255,255,255,.13)" stroke-width="1"/>
<text x="948" y="584" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#8aaec2" text-anchor="middle">15 yr</text>
<line x1="1120" y1="150" x2="1120" y2="556" stroke="rgba(255,255,255,.13)" stroke-width="1"/>
<text x="1120" y="584" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#8aaec2" text-anchor="middle">20 yr</text>
<text x="48" y="198" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#ffffff">Exceptional care, documented</text>
<rect x="430" y="162" width="690" height="58" rx="10" fill="rgba(255,255,255,.06)"/>
<rect x="1051" y="162" width="69" height="58" rx="10" fill="#2bd4c4" opacity=".9"/>
<text x="1086" y="199" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#06202e" text-anchor="middle">18&#8211;20</text>
<text x="48" y="276" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#ffffff">Well kept: 75-125 gal, NO3 &lt;20ppm</text>
<rect x="430" y="240" width="690" height="58" rx="10" fill="rgba(255,255,255,.06)"/>
<rect x="844" y="240" width="104" height="58" rx="10" fill="#27ae60" opacity=".9"/>
<text x="896" y="277" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#06202e" text-anchor="middle">12&#8211;15</text>
<text x="48" y="354" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#ffffff">Average home aquarium</text>
<rect x="430" y="318" width="690" height="58" rx="10" fill="rgba(255,255,255,.06)"/>
<rect x="706" y="318" width="138" height="58" rx="10" fill="#f0b429" opacity=".9"/>
<text x="775" y="355" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#06202e" text-anchor="middle">8&#8211;12</text>
<text x="48" y="432" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#ffffff">Wild (Amazon basin, estimated)</text>
<rect x="430" y="396" width="690" height="58" rx="10" fill="rgba(255,255,255,.06)"/>
<rect x="706" y="396" width="69" height="58" rx="10" fill="#7f9fb5" opacity=".9"/>
<text x="740" y="433" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#06202e" text-anchor="middle">8&#8211;10</text>
<text x="48" y="510" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#ffffff">Undersized tank or poor diet</text>
<rect x="430" y="474" width="690" height="58" rx="10" fill="rgba(255,255,255,.06)"/>
<rect x="534" y="474" width="104" height="58" rx="10" fill="#e2574c" opacity=".9"/>
<text x="585" y="511" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#06202e" text-anchor="middle">3&#8211;6</text>
<text x="48" y="614" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#8aaec2">Nitrate held under 20 ppm by weekly 40&#8211;50% water changes is the single biggest lever on the figure above.</text>
</svg>