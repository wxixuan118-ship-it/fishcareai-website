<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t2 d2">
<title id="t2">Betta fish tank size rules: 5 gallons minimum and 10 recommended for one male, 20 gallons for a sorority of 5, never two males</title>
<desc id="d2">Three panels: one male betta next to a 5 to 10 gallon block; five female bettas next to a 20 gallon block; two male bettas inside a no symbol.</desc>
<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061b2c"/><stop offset="1" stop-color="#0c3d5c"/></linearGradient></defs>
<rect width="1200" height="420" rx="24" fill="url(#bg2)"/>
<rect x="40" y="40" width="360" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="66" y="86" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">One male, 5–10 gal</text>
<text x="66" y="112" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#8aaec2">5 gallons is the floor; 10 keeps heat and chemistry steady.</text>
<g transform="translate(40,0)"><g transform="translate(95.0,225.0) scale(2.8,2.8)"><path d="M-8,0 Q-16,-12 -24,-4 Q-20,0 -24,4 Q-16,12 -8,0 Z" fill="#2bd4c4" opacity=".75"/><path d="M-4,-4 Q2,-13 9,-4 Z" fill="#2bd4c4" opacity=".7"/><path d="M-4,4 Q2,13 9,4 Z" fill="#2bd4c4" opacity=".7"/><ellipse cx="2" cy="0" rx="9" ry="4.2" fill="#2bd4c4"/><circle cx="8" cy="-1" r="1.2" fill="#061b2c"/></g><text x="160" y="236" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="34" font-weight="800" fill="#fff">=</text><rect x="210" y="170" width="120" height="110" rx="12" fill="#1b6f8f" opacity=".55" stroke="#2bd4c4" stroke-width="2"/><text x="270.0" y="227.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#fff">5–10</text><text x="270.0" y="249.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8aaec2">gallons</text></g>
<text x="66" y="352" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#dff0fa">Heater, sponge filter, weekly 30% water change.</text>
<rect x="420" y="40" width="360" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="446" y="86" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">Sorority, 20 gal+</text>
<text x="446" y="112" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#8aaec2">Five or more females, dense plants, line-of-sight breaks.</text>
<g transform="translate(420,0)"><g transform="translate(70.0,210.0) scale(1.3,1.3)"><path d="M-8,0 Q-16,-12 -24,-4 Q-20,0 -24,4 Q-16,12 -8,0 Z" fill="#2bd4c4" opacity=".75"/><path d="M-4,-4 Q2,-13 9,-4 Z" fill="#2bd4c4" opacity=".7"/><path d="M-4,4 Q2,13 9,4 Z" fill="#2bd4c4" opacity=".7"/><ellipse cx="2" cy="0" rx="9" ry="4.2" fill="#2bd4c4"/><circle cx="8" cy="-1" r="1.2" fill="#061b2c"/></g><g transform="translate(102.0,220.0) scale(1.3,1.3)"><path d="M-8,0 Q-16,-12 -24,-4 Q-20,0 -24,4 Q-16,12 -8,0 Z" fill="#f4a23e" opacity=".75"/><path d="M-4,-4 Q2,-13 9,-4 Z" fill="#f4a23e" opacity=".7"/><path d="M-4,4 Q2,13 9,4 Z" fill="#f4a23e" opacity=".7"/><ellipse cx="2" cy="0" rx="9" ry="4.2" fill="#f4a23e"/><circle cx="8" cy="-1" r="1.2" fill="#061b2c"/></g><g transform="translate(134.0,210.0) scale(1.3,1.3)"><path d="M-8,0 Q-16,-12 -24,-4 Q-20,0 -24,4 Q-16,12 -8,0 Z" fill="#5b7efc" opacity=".75"/><path d="M-4,-4 Q2,-13 9,-4 Z" fill="#5b7efc" opacity=".7"/><path d="M-4,4 Q2,13 9,4 Z" fill="#5b7efc" opacity=".7"/><ellipse cx="2" cy="0" rx="9" ry="4.2" fill="#5b7efc"/><circle cx="8" cy="-1" r="1.2" fill="#061b2c"/></g><g transform="translate(166.0,220.0) scale(1.3,1.3)"><path d="M-8,0 Q-16,-12 -24,-4 Q-20,0 -24,4 Q-16,12 -8,0 Z" fill="#ff7a9e" opacity=".75"/><path d="M-4,-4 Q2,-13 9,-4 Z" fill="#ff7a9e" opacity=".7"/><path d="M-4,4 Q2,13 9,4 Z" fill="#ff7a9e" opacity=".7"/><ellipse cx="2" cy="0" rx="9" ry="4.2" fill="#ff7a9e"/><circle cx="8" cy="-1" r="1.2" fill="#061b2c"/></g><g transform="translate(198.0,210.0) scale(1.3,1.3)"><path d="M-8,0 Q-16,-12 -24,-4 Q-20,0 -24,4 Q-16,12 -8,0 Z" fill="#7ee081" opacity=".75"/><path d="M-4,-4 Q2,-13 9,-4 Z" fill="#7ee081" opacity=".7"/><path d="M-4,4 Q2,13 9,4 Z" fill="#7ee081" opacity=".7"/><ellipse cx="2" cy="0" rx="9" ry="4.2" fill="#7ee081"/><circle cx="8" cy="-1" r="1.2" fill="#061b2c"/></g><text x="215" y="236" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="34" font-weight="800" fill="#fff">=</text><rect x="250" y="170" width="90" height="110" rx="12" fill="#1b6f8f" opacity=".55" stroke="#2bd4c4" stroke-width="2"/><text x="295.0" y="227.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#fff">20</text><text x="295.0" y="249.0" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8aaec2">gal + 5 each</text></g>
<text x="446" y="352" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#dff0fa">6–8 females in a 29–40 is the stable setup.</text>
<rect x="800" y="40" width="360" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="826" y="86" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">Never two males</text>
<text x="826" y="112" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#8aaec2">Even a divider causes chronic stress and fin damage.</text>
<g transform="translate(800,0)"><g transform="translate(130.0,215.0) scale(2.2,2.2)"><path d="M-8,0 Q-16,-12 -24,-4 Q-20,0 -24,4 Q-16,12 -8,0 Z" fill="#f4a23e" opacity=".75"/><path d="M-4,-4 Q2,-13 9,-4 Z" fill="#f4a23e" opacity=".7"/><path d="M-4,4 Q2,13 9,4 Z" fill="#f4a23e" opacity=".7"/><ellipse cx="2" cy="0" rx="9" ry="4.2" fill="#f4a23e"/><circle cx="8" cy="-1" r="1.2" fill="#061b2c"/></g><g transform="translate(215.0,215.0) scale(-2.2,2.2)"><path d="M-8,0 Q-16,-12 -24,-4 Q-20,0 -24,4 Q-16,12 -8,0 Z" fill="#ff7a9e" opacity=".75"/><path d="M-4,-4 Q2,-13 9,-4 Z" fill="#ff7a9e" opacity=".7"/><path d="M-4,4 Q2,13 9,4 Z" fill="#ff7a9e" opacity=".7"/><ellipse cx="2" cy="0" rx="9" ry="4.2" fill="#ff7a9e"/><circle cx="8" cy="-1" r="1.2" fill="#061b2c"/></g><circle cx="172" cy="215" r="70" fill="none" stroke="#ff7a9e" stroke-width="5"/><path d="M123.0,166.0 L221.0,264.0" stroke="#ff7a9e" stroke-width="5"/></g>
<text x="826" y="352" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#dff0fa">One male per tank, whatever the size.</text>
</svg>