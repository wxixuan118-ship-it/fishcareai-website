<text x="48" y="98" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#8aaec2">Planning rule: 5 gallons minimum and 10 recommended for one male. Sororities start at 20 gallons for 5 females, plus 5 gallons per extra female.</text>
