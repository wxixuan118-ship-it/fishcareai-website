<text x="685" y="233" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#fff">2 gal</text>
<text x="446" y="352" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#dff0fa">20 gal → 10 · 40 gal → 20 · 55 gal → 27</text>
