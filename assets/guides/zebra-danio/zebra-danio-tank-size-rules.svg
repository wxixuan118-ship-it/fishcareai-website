<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t2 d2">
<title id="t2">Zebra danio tank size rules: a 30-inch lane for a school of 6–10, 2 gallons per extra danio, tight lid</title>
<desc id="d2">Three panels: a long low tank with a school of danios labelled 30 inches; one danio next to a two gallon block; a tank outline with a lid.</desc>
<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061b2c"/><stop offset="1" stop-color="#0c3d5c"/></linearGradient></defs>
<rect width="1200" height="420" rx="24" fill="url(#bg2)"/>
<rect x="40" y="40" width="360" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="66" y="86" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">Length before gallons</text>
<text x="66" y="112" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#8aaec2">A school of 6–10 needs a 30-inch lane: the 20-gallon long.</text>
<rect x="420" y="40" width="360" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="446" y="86" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">The 2-gallon rule</text>
<text x="446" y="112" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#8aaec2">Past 10 fish, add about 2 US gallons (7.5 L) per danio.</text>
<rect x="800" y="40" width="360" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="826" y="86" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#fff">Tight lid, always</text>
<text x="826" y="112" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#8aaec2">Danios jump when startled. Seal every gap in the cover.</text>
