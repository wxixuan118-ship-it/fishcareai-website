<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Algae eater fish by tank size: what eats algae in a 5 to 75 gallon tank</title>
<desc id="d">Algae eater fish chart by tank size: nerite snail and amano shrimp for 5 to 10 gallons, otocinclus for 10 to 20 gallons, bristlenose pleco for 20 to 29 gallons, siamese algae eater for 29 to 40 gallons, rubber-lip pleco for 40 to 55 gallons, flag fish and mollies for 55 to 75 gallons; common pleco and chinese algae eater not recommended</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061b2c"/><stop offset="1" stop-color="#0c3d5c"/></linearGradient><linearGradient id="ok" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2bd4c4"/><stop offset="1" stop-color="#27ae60"/></linearGradient></defs>
<rect width="1200" height="640" rx="24" fill="url(#bg)"/>
<text x="48" y="64" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="26" font-weight="800" fill="#ffffff">Algae eater fish by tank size: what eats algae in a 5 to 75 gallon tank</text>
<text x="48" y="98" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#8aaec2">Freshwater algae eaters matched to tank size and the algae they actually eat. One adult per row unless stated.</text>
<rect x="48" y="150" width="1104" height="48" rx="12" fill="rgba(255,255,255,.1)"/>
<text x="72" y="181" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">5–10 gallons</text>
<rect x="308" y="164" width="376" height="20" rx="9" fill="url(#ok)"/>
<text x="324" y="181" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">nerite snail, amano shrimp</text>
<text x="708" y="181" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">green film, spot algae, diatoms</text>
<rect x="48" y="208" width="1104" height="48" rx="12" fill="rgba(255,255,255,.06)"/>
<text x="72" y="239" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">10–20 gallons</text>
<rect x="308" y="222" width="376" height="20" rx="9" fill="url(#ok)"/>
<text x="324" y="239" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">otocinclus (group of 6)</text>
<text x="708" y="239" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">diatoms, soft green film</text>
<rect x="48" y="266" width="1104" height="48" rx="12" fill="rgba(255,255,255,.1)"/>
<text x="72" y="297" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">20–29 gallons</text>
<rect x="308" y="280" width="376" height="20" rx="9" fill="url(#ok)"/>
<text x="324" y="297" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">bristlenose pleco, cherry shrimp</text>
<text x="708" y="297" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">green film, biofilm, wood</text>
<rect x="48" y="324" width="1104" height="48" rx="12" fill="rgba(255,255,255,.06)"/>
<text x="72" y="355" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">29–40 gallons</text>
<rect x="308" y="338" width="376" height="20" rx="9" fill="url(#ok)"/>
<text x="324" y="355" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">siamese algae eater (3+)</text>
<text x="708" y="355" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">black beard algae, hair algae</text>
<rect x="48" y="382" width="1104" height="48" rx="12" fill="rgba(255,255,255,.1)"/>
<text x="72" y="413" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">40–55 gallons</text>
<rect x="308" y="396" width="376" height="20" rx="9" fill="url(#ok)"/>
<text x="324" y="413" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">rubber-lip pleco, clown pleco</text>
<text x="708" y="413" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">green film, spot algae</text>
<rect x="48" y="440" width="1104" height="48" rx="12" fill="rgba(255,255,255,.06)"/>
<text x="72" y="471" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">55–75 gallons</text>
<rect x="308" y="454" width="376" height="20" rx="9" fill="url(#ok)"/>
<text x="324" y="471" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">American-flag fish, mollies</text>
<text x="708" y="471" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">hair and thread algae</text>
<rect x="48" y="498" width="1104" height="48" rx="12" fill="rgba(255,255,255,.1)"/>
<text x="72" y="529" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Never for algae</text>
<rect x="308" y="512" width="376" height="20" rx="9" fill="url(#ok)"/>
<text x="324" y="529" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">common pleco, chinese algae eater</text>
<text x="708" y="529" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">outgrow tanks, stop eating algae</text>
<text x="48" y="600" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#8aaec2">No algae eater fixes the cause. Pair the animal with the fix on the algae control page.</text>
<text x="1152" y="618" text-anchor="end" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#5f8aa3">fishcareai.com</text>
</svg>