<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Siamese algae eaters vs the look-alikes sold under the same name</title>
<desc id="d">Siamese algae eaters comparison chart: true SAE has a black stripe running into the tail fork and eats black beard algae; flying fox and false SAE stripes stop at the tail base; chinese algae eater has a sucker mouth, grows to 11 inches and stops eating algae at 4 inches</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061b2c"/><stop offset="1" stop-color="#0c3d5c"/></linearGradient><linearGradient id="ok" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2bd4c4"/><stop offset="1" stop-color="#27ae60"/></linearGradient></defs>
<rect width="1200" height="640" rx="24" fill="url(#bg)"/>
<text x="48" y="64" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="26" font-weight="800" fill="#ffffff">Siamese algae eaters vs the look-alikes sold under the same name</text>
<text x="48" y="98" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#8aaec2">True SAE (Crossocheilus oblongus) against flying fox, false SAE and the Chinese algae eater.</text>
<rect x="48" y="150" width="1104" height="58" rx="12" fill="rgba(255,255,255,.1)"/>
<text x="72" y="186" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#ffffff">True siamese algae eater</text>
<rect x="399" y="164" width="329" height="30" rx="9" fill="url(#ok)"/>
<text x="415" y="186" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#03222f">black stripe runs into the tail fork</text>
<text x="752" y="186" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#b8d3e2">clear fins, eats black beard algae, 6 in, peaceful</text>
<rect x="48" y="218" width="1104" height="58" rx="12" fill="rgba(255,255,255,.06)"/>
<text x="72" y="254" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#ffffff">Flying fox (Epalzeorhynchos)</text>
<rect x="399" y="232" width="329" height="30" rx="9" fill="url(#ok)"/>
<text x="415" y="254" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#03222f">stripe stops at tail base</text>
<text x="752" y="254" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#b8d3e2">gold line above stripe, red-edged fins, less algae</text>
<rect x="48" y="286" width="1104" height="58" rx="12" fill="rgba(255,255,255,.1)"/>
<text x="72" y="322" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#ffffff">False SAE (Garra cambodgiensis)</text>
<rect x="399" y="300" width="329" height="30" rx="9" fill="url(#ok)"/>
<text x="415" y="322" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#03222f">stripe stops at tail base</text>
<text x="752" y="322" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#b8d3e2">two barbel pairs, black-edged fins, eats little algae</text>
<rect x="48" y="354" width="1104" height="58" rx="12" fill="rgba(255,255,255,.06)"/>
<text x="72" y="390" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#ffffff">Chinese algae eater (Gyrinocheilus)</text>
<rect x="399" y="368" width="329" height="30" rx="9" fill="url(#ok)"/>
<text x="415" y="390" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#03222f">sucker mouth, 11 in adult</text>
<text x="752" y="390" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#b8d3e2">stops eating algae at 4 in, rasps slime off slow fish</text>
<rect x="48" y="422" width="1104" height="58" rx="12" fill="rgba(255,255,255,.1)"/>
<text x="72" y="458" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#ffffff">Tank size</text>
<rect x="399" y="436" width="329" height="30" rx="9" fill="url(#ok)"/>
<text x="415" y="458" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#03222f">30 gal for 3+ SAE</text>
<text x="752" y="458" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#b8d3e2">55 gal for a Chinese algae eater</text>
<rect x="48" y="490" width="1104" height="58" rx="12" fill="rgba(255,255,255,.06)"/>
<text x="72" y="526" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#ffffff">Temperature</text>
<rect x="399" y="504" width="329" height="30" rx="9" fill="url(#ok)"/>
<text x="415" y="526" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#03222f">75–79°F (24–26°C)</text>
<text x="752" y="526" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#b8d3e2">72–82°F for the Chinese algae eater</text>
<text x="48" y="600" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#8aaec2">Shops label all four as siamese algae eaters. Check the stripe and the fins before you buy.</text>
<text x="1152" y="618" text-anchor="end" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#5f8aa3">fishcareai.com</text>
</svg>