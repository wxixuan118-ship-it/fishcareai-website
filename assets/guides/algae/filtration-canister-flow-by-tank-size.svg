<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Filtration canister flow rate by tank size</title>
<desc id="d">Filtration canister flow rate chart: 120 to 180 GPH for 20 to 29 gallons, 220 to 330 GPH for 40 to 55 gallons, 300 to 450 GPH for 75 gallons, 450 to 750 GPH for 90 to 125 gallons, over 750 GPH for 150 gallons and up; public aquariums use sand filters and protein skimmers</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061b2c"/><stop offset="1" stop-color="#0c3d5c"/></linearGradient><linearGradient id="ok" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2bd4c4"/><stop offset="1" stop-color="#27ae60"/></linearGradient></defs>
<rect width="1200" height="640" rx="24" fill="url(#bg)"/>
<text x="48" y="64" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#ffffff">Filtration canister flow rate by tank size</text>
<text x="48" y="98" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#8aaec2">Rated pump flow of a tank canister filter, using the 4x to 6x tank volume per hour rule. Real flow is 30 to 50% lower with media.</text>
<rect x="48" y="150" width="1104" height="58" rx="12" fill="rgba(255,255,255,.1)"/>
<text x="72" y="186" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">20–29 gallons</text>
<rect x="308" y="164" width="418" height="30" rx="9" fill="url(#ok)"/>
<text x="324" y="186" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">120–180 GPH</text>
<text x="750" y="186" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">smallest canister worth buying</text>
<rect x="48" y="218" width="1104" height="58" rx="12" fill="rgba(255,255,255,.06)"/>
<text x="72" y="254" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">40–55 gallons</text>
<rect x="308" y="232" width="418" height="30" rx="9" fill="url(#ok)"/>
<text x="324" y="254" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">220–330 GPH</text>
<text x="750" y="254" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">the sweet spot for one canister</text>
<rect x="48" y="286" width="1104" height="58" rx="12" fill="rgba(255,255,255,.1)"/>
<text x="72" y="322" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">75 gallons</text>
<rect x="308" y="300" width="418" height="30" rx="9" fill="url(#ok)"/>
<text x="324" y="322" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">300–450 GPH</text>
<text x="750" y="322" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">one large or two mid-size canisters</text>
<rect x="48" y="354" width="1104" height="58" rx="12" fill="rgba(255,255,255,.06)"/>
<text x="72" y="390" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">90–125 gallons</text>
<rect x="308" y="368" width="418" height="30" rx="9" fill="url(#ok)"/>
<text x="324" y="390" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">450–750 GPH</text>
<text x="750" y="390" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">two canisters or a sump</text>
<rect x="48" y="422" width="1104" height="58" rx="12" fill="rgba(255,255,255,.1)"/>
<text x="72" y="458" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">150–180 gallons</text>
<rect x="308" y="436" width="418" height="30" rx="9" fill="url(#ok)"/>
<text x="324" y="458" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">750–1,000+ GPH</text>
<text x="750" y="458" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">sump usually cheaper</text>
<rect x="48" y="490" width="1104" height="58" rx="12" fill="rgba(255,255,255,.06)"/>
<text x="72" y="526" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Public aquariums</text>
<rect x="308" y="504" width="418" height="30" rx="9" fill="url(#ok)"/>
<text x="324" y="526" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">sand filters, protein skimmers, ozone</text>
<text x="750" y="526" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">thousands of gallons per minute</text>
<text x="48" y="600" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#8aaec2">Heavily stocked tanks (goldfish, cichlids, plecos) take the top of each range or the next size up.</text>
<text x="1152" y="618" text-anchor="end" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#5f8aa3">fishcareai.com</text>
</svg>