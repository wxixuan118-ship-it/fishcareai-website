<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">How to get rid of algae in a fish tank: the 7-step plan</title>
<desc id="d">How to get rid of algae in fish tank chart: cut light to 6 to 8 hours, test nitrate under 20 ppm and phosphate under 0.5 ppm, 25 to 30 percent weekly water changes, scrub and siphon, fix filter flow, add plants and algae eaters, algae control drops only as a last resort</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061b2c"/><stop offset="1" stop-color="#0c3d5c"/></linearGradient><linearGradient id="ok" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2bd4c4"/><stop offset="1" stop-color="#27ae60"/></linearGradient></defs>
<rect width="1200" height="640" rx="24" fill="url(#bg)"/>
<text x="48" y="64" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#ffffff">How to get rid of algae in a fish tank: the 7-step plan</text>
<text x="48" y="98" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#8aaec2">Aquarium algae control in order. Each step removes a cause; algae eaters and drops come last, not first.</text>
<rect x="48" y="150" width="1104" height="48" rx="12" fill="rgba(255,255,255,.1)"/>
<text x="72" y="181" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">1. Cut the light</text>
<rect x="337" y="164" width="397" height="20" rx="9" fill="url(#ok)"/>
<text x="353" y="181" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">6–8 hours a day on a timer</text>
<text x="759" y="181" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">no window sun; most common cause</text>
<rect x="48" y="208" width="1104" height="48" rx="12" fill="rgba(255,255,255,.06)"/>
<text x="72" y="239" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">2. Test the water</text>
<rect x="337" y="222" width="397" height="20" rx="9" fill="url(#ok)"/>
<text x="353" y="239" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">nitrate &lt;20 ppm, phosphate &lt;0.5 ppm</text>
<text x="759" y="239" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">feed less; algae eats the excess</text>
<rect x="48" y="266" width="1104" height="48" rx="12" fill="rgba(255,255,255,.1)"/>
<text x="72" y="297" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">3. Water changes</text>
<rect x="337" y="280" width="397" height="20" rx="9" fill="url(#ok)"/>
<text x="353" y="297" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">25–30% weekly for 4 weeks</text>
<text x="759" y="297" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">export nutrients, reset CO2 balance</text>
<rect x="48" y="324" width="1104" height="48" rx="12" fill="rgba(255,255,255,.06)"/>
<text x="72" y="355" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">4. Scrub and siphon</text>
<rect x="337" y="338" width="397" height="20" rx="9" fill="url(#ok)"/>
<text x="353" y="355" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">glass, rock, wood, gravel</text>
<text x="759" y="355" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">remove the bulk by hand</text>
<rect x="48" y="382" width="1104" height="48" rx="12" fill="rgba(255,255,255,.1)"/>
<text x="72" y="413" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">5. Fix the filter</text>
<rect x="337" y="396" width="397" height="20" rx="9" fill="url(#ok)"/>
<text x="353" y="413" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">clean media, boost flow</text>
<text x="759" y="413" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">dead spots grow algae</text>
<rect x="48" y="440" width="1104" height="48" rx="12" fill="rgba(255,255,255,.06)"/>
<text x="72" y="471" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">6. Add plants or eaters</text>
<rect x="337" y="454" width="397" height="20" rx="9" fill="url(#ok)"/>
<text x="353" y="471" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">fast plants, then SAE, oto, nerite</text>
<text x="759" y="471" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">outcompete, then graze</text>
<rect x="48" y="498" width="1104" height="48" rx="12" fill="rgba(255,255,255,.1)"/>
<text x="72" y="529" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#ffffff">7. Algae control drops</text>
<rect x="337" y="512" width="397" height="20" rx="9" fill="url(#ok)"/>
<text x="353" y="529" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#03222f">last resort, half dose</text>
<text x="759" y="529" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#b8d3e2">never with shrimp or plants</text>
<text x="48" y="600" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#8aaec2">Expect 3 to 4 weeks. Algae that comes back means a step was skipped.</text>
<text x="1152" y="618" text-anchor="end" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#5f8aa3">fishcareai.com</text>
</svg>