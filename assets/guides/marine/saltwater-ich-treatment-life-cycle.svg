<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="t d">
<title id="t">Marine ich life cycle diagram</title>
<desc id="d">Marine ich moves from trophont on the fish to protomont, tomont cyst and free-swimming theront, the main treatment target.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c4dbe8"/></marker></defs>
<rect width="720" height="500" rx="20" fill="#0a2a42"/>
<text x="36" y="52" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="start">Marine ich life cycle</text>
<rect x="36" y="84" width="300" height="134" rx="14" fill="#123a56" />
<text x="54" y="122" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#ffffff" text-anchor="start">Trophont</text>
<text x="54" y="156" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#c4dbe8" text-anchor="start">Feeds under the skin</text>
<text x="54" y="190" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start">About 3–7 days</text>
<rect x="384" y="84" width="300" height="134" rx="14" fill="#123a56" />
<text x="402" y="122" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#ffffff" text-anchor="start">Protomont</text>
<text x="402" y="156" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#c4dbe8" text-anchor="start">Moves onto a surface</text>
<text x="402" y="190" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start">About 2–18 hours</text>
<rect x="384" y="292" width="300" height="134" rx="14" fill="#123a56" />
<text x="402" y="330" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#ffffff" text-anchor="start">Tomont</text>
<text x="402" y="364" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#c4dbe8" text-anchor="start">Protected cyst</text>
<text x="402" y="398" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start">Most 4–8 days, up to 72</text>
<rect x="36" y="292" width="300" height="134" rx="14" fill="#1f9d7a" />
<text x="54" y="330" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#ffffff" text-anchor="start">Theront</text>
<text x="54" y="364" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#ffffff" text-anchor="start">Swims to find a fish</text>
<text x="54" y="398" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start">Treatment target</text>
<line x1="340" y1="151" x2="380" y2="151" stroke="#c4dbe8" stroke-width="3" marker-end="url(#a)"/>
<line x1="534" y1="222" x2="534" y2="288" stroke="#c4dbe8" stroke-width="3" marker-end="url(#a)"/>
<line x1="380" y1="359" x2="340" y2="359" stroke="#c4dbe8" stroke-width="3" marker-end="url(#a)"/>
<line x1="186" y1="288" x2="186" y2="222" stroke="#c4dbe8" stroke-width="3" marker-end="url(#a)"/>
<text x="36" y="470" font-family="-apple-system,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#c4dbe8" text-anchor="start">Spots fading doesn&#x27;t mean the parasite has gone.</text>
</svg>
