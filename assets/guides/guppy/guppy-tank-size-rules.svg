<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t2 d2">
<title id="t2">Guppy tank size rule: 2 gallons per guppy and a 1 male to 2–3 female ratio</title>
<desc id="d2">Left panel shows one guppy next to a two gallon water block; right panel shows one male guppy with three female guppies.</desc>
<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061b2c"/><stop offset="1" stop-color="#0c3d5c"/></linearGradient></defs>
<rect width="1200" height="420" rx="24" fill="url(#bg2)"/>
<rect x="40" y="40" width="540" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<rect x="620" y="40" width="540" height="340" rx="18" fill="#0c3349" stroke="#3e8cb4" stroke-opacity=".45" stroke-width="2"/>
<text x="70" y="88" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="24" font-weight="800" fill="#fff">The 2-gallon rule</text>
<text x="70" y="118" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#8aaec2">Each adult guppy needs about 2 US gallons (7.5 L) of water.</text>
<g transform="translate(130.0,220.0) scale(2.6,2.6)"><path d="M-13,0 L-6,-7 L-4,-2 L-4,2 L-6,7 Z" fill="#2bd4c4" opacity=".85"/><ellipse cx="3" cy="0" rx="8" ry="4.2" fill="#2bd4c4"/><circle cx="8" cy="-1" r="1.2" fill="#061b2c"/></g>
<text x="215" y="232" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="34" font-weight="800" fill="#fff">=</text>
<rect x="270" y="165" width="110" height="110" rx="12" fill="#1b6f8f" opacity=".55" stroke="#2bd4c4" stroke-width="2"/>
<text x="325" y="228" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#fff">2 gal</text>
<text x="70" y="330" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#dff0fa">10 gal → 5 guppies · 20 gal → 10 guppies · 40 gal → 20 guppies</text>
<text x="650" y="88" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="24" font-weight="800" fill="#fff">Mixed-sex ratio</text>
<text x="650" y="118" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#8aaec2">Keep 1 male to 2–3 females so no single female is chased constantly.</text>
<g transform="translate(720.0,220.0) scale(2.4,2.4)"><path d="M-13,0 L-6,-7 L-4,-2 L-4,2 L-6,7 Z" fill="#f4a23e" opacity=".85"/><ellipse cx="3" cy="0" rx="8" ry="4.2" fill="#f4a23e"/><circle cx="8" cy="-1" r="1.2" fill="#061b2c"/></g>
<text x="720" y="275" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#f4a23e">1 male</text>
<text x="800" y="232" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="34" font-weight="800" fill="#fff">:</text>
<g transform="translate(880.0,220.0) scale(2.1,2.1)"><path d="M-13,0 L-6,-7 L-4,-2 L-4,2 L-6,7 Z" fill="#8aaec2" opacity=".85"/><ellipse cx="3" cy="0" rx="8" ry="4.2" fill="#8aaec2"/><circle cx="8" cy="-1" r="1.2" fill="#061b2c"/></g>
<g transform="translate(970.0,220.0) scale(2.1,2.1)"><path d="M-13,0 L-6,-7 L-4,-2 L-4,2 L-6,7 Z" fill="#8aaec2" opacity=".85"/><ellipse cx="3" cy="0" rx="8" ry="4.2" fill="#8aaec2"/><circle cx="8" cy="-1" r="1.2" fill="#061b2c"/></g>
<g transform="translate(1060.0,220.0) scale(2.1,2.1)"><path d="M-13,0 L-6,-7 L-4,-2 L-4,2 L-6,7 Z" fill="#8aaec2" opacity=".85"/><ellipse cx="3" cy="0" rx="8" ry="4.2" fill="#8aaec2"/><circle cx="8" cy="-1" r="1.2" fill="#061b2c"/></g>
<text x="970" y="275" text-anchor="middle" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#8aaec2">2–3 females</text>
<text x="650" y="330" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#dff0fa">Expect 20–100 fry per female every ~30 days — size the tank for growth.</text>
</svg>