<text x="48" y="98" font-family="Inter,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#8aaec2">Planning rule: 2 US gallons per adult guppy, minimum group of 5, in a cycled tank with weekly water changes.</text>
