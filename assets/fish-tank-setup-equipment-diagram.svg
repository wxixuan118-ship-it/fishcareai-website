<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Labelled diagram of a set up freshwater fish tank showing eight parts: a level stand rated for the filled weight, a lid and LED light, a hang-on-back filter with submerged intake, a heater with a separate thermometer, two to three inches of substrate, plants and hiding places, a water line below the rim, and a drip loop on every power cord.">
<defs>
<linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12507C"/><stop offset="1" stop-color="#1B7FB8"/></linearGradient>
<linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4FAFF"/><stop offset="1" stop-color="#E7F3FC"/></linearGradient>
<linearGradient id="wtr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CDEAF8"/><stop offset="1" stop-color="#8CC7E8"/></linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4CF" stop-opacity=".85"/><stop offset="1" stop-color="#FFF4CF" stop-opacity="0"/></linearGradient>
</defs>
<rect width="900" height="600" rx="18" fill="url(#bgg)"/>
<rect width="900" height="96" rx="18" fill="url(#hd)"/><rect y="64" width="900" height="32" fill="#1B7FB8"/>
<g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">
<text x="450" y="42" font-size="28" font-weight="800" fill="#FFFFFF">Fish Tank Setup: What Goes Where</text>
<text x="450" y="72" font-size="15" font-weight="600" fill="#CFEBFF">Every part installed before the first fish arrives</text>
</g>
<g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">

<!-- stand -->
<rect x="186" y="382" width="528" height="26" rx="6" fill="#59748E"/>
<rect x="206" y="408" width="18" height="16" fill="#46607A"/>
<rect x="676" y="408" width="18" height="16" fill="#46607A"/>

<!-- tank -->
<rect x="210" y="140" width="480" height="242" rx="5" fill="#EAF6FD" stroke="#12507C" stroke-width="4"/>
<rect x="214" y="160" width="472" height="218" fill="url(#wtr)"/>
<rect x="214" y="144" width="472" height="44" fill="url(#glow)"/>
<!-- lid + light -->
<rect x="202" y="124" width="496" height="18" rx="5" fill="#274B66"/>
<rect x="240" y="142" width="420" height="5" rx="2.5" fill="#FFE08A"/>
<!-- water line -->
<line x1="214" y1="160" x2="686" y2="160" stroke="#0F3D5E" stroke-width="2" stroke-dasharray="7 6" opacity=".55"/>
<!-- substrate -->
<path d="M214 378 L214 336 C280 326 330 340 400 332 C470 324 540 340 610 334 C645 331 665 336 686 333 L686 378 Z" fill="#CDBB97"/>
<path d="M214 336 C280 326 330 340 400 332 C470 324 540 340 610 334 C645 331 665 336 686 333" fill="none" stroke="#B7A280" stroke-width="3"/>
<!-- plants -->
<g fill="#2E9E7D">
<path d="M282 334 C266 300 272 268 288 246 C292 280 300 306 296 334 Z"/>
<path d="M296 334 C312 306 330 288 350 280 C338 302 322 322 310 334 Z"/>
<path d="M600 332 C588 302 592 274 606 254 C610 284 616 308 613 332 Z"/>
<path d="M613 332 C628 310 644 296 660 290 C650 308 636 322 625 332 Z"/>
</g>
<g fill="#3FB894" opacity=".8">
<path d="M340 332 C334 312 338 292 348 278 C352 300 354 316 352 332 Z"/>
</g>
<!-- cave / hiding place -->
<path d="M430 332 C430 300 466 288 494 296 C516 302 522 318 520 332 Z" fill="#8B99A6"/>
<path d="M452 332 C452 316 466 306 482 308 C494 310 500 320 499 332 Z" fill="#4E5F6E"/>
<!-- heater -->
<rect x="630" y="196" width="15" height="118" rx="7.5" fill="#F2F6F9" stroke="#8FA5B6" stroke-width="2"/>
<rect x="630" y="196" width="15" height="22" rx="7.5" fill="#E0592F"/>
<path d="M637 196 L637 168 C637 160 645 156 654 156" fill="none" stroke="#274B66" stroke-width="3"/>
<!-- thermometer -->
<rect x="238" y="200" width="15" height="86" rx="7.5" fill="#FFFFFF" stroke="#8FA5B6" stroke-width="2"/>
<rect x="242" y="240" width="7" height="42" rx="3.5" fill="#C0392B"/>
<!-- hang-on-back filter -->
<rect x="686" y="130" width="70" height="80" rx="7" fill="#F2F6F9" stroke="#274B66" stroke-width="3"/>
<rect x="694" y="140" width="54" height="30" rx="4" fill="#8FCBEA"/>
<rect x="694" y="176" width="54" height="10" rx="3" fill="#2E9E7D"/>
<path d="M666 206 L666 318" stroke="#274B66" stroke-width="7" stroke-linecap="round"/>
<path d="M666 206 L686 190" stroke="#274B66" stroke-width="7" stroke-linecap="round"/>
<path d="M686 172 C674 172 668 182 668 192" fill="none" stroke="#274B66" stroke-width="5"/>
<path d="M672 194 C666 206 660 214 652 220" fill="none" stroke="#8CC7E8" stroke-width="6" stroke-linecap="round" opacity=".9"/>
<!-- power cord + drip loop -->
<path d="M756 168 C790 176 806 220 800 268 C796 302 812 312 826 300 C836 292 836 276 836 262" fill="none" stroke="#274B66" stroke-width="4"/>
<rect x="820" y="216" width="34" height="46" rx="6" fill="#FFFFFF" stroke="#8FA5B6" stroke-width="2.5"/>
<circle cx="831" cy="234" r="3" fill="#8FA5B6"/><circle cx="843" cy="234" r="3" fill="#8FA5B6"/>
<rect x="829" y="244" width="16" height="4" rx="2" fill="#8FA5B6"/>

<!-- markers -->
<g font-size="14" font-weight="800" text-anchor="middle">
<circle cx="252" cy="395" r="14" fill="#12507C"/><text x="252" y="400" fill="#FFF">1</text>
<circle cx="252" cy="133" r="14" fill="#12507C"/><text x="252" y="138" fill="#FFF">2</text>
<circle cx="721" cy="170" r="14" fill="#12507C"/><text x="721" y="175" fill="#FFF">3</text>
<circle cx="602" cy="196" r="14" fill="#12507C"/><text x="602" y="201" fill="#FFF">4</text>
<circle cx="330" cy="356" r="14" fill="#12507C"/><text x="330" y="361" fill="#FFF">5</text>
<circle cx="474" cy="316" r="14" fill="#12507C"/><text x="474" y="321" fill="#FFF">6</text>
<circle cx="446" cy="160" r="14" fill="#12507C"/><text x="446" y="165" fill="#FFF">7</text>
<circle cx="800" cy="290" r="14" fill="#12507C"/><text x="800" y="295" fill="#FFF">8</text>
</g>

<!-- legend -->
<g font-size="13.5" fill="#2A4A63">
<g transform="translate(28,432)"><circle cx="11" cy="11" r="11" fill="#12507C"/><text x="11" y="16" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">1</text><text x="32" y="10" font-size="14" font-weight="700" fill="#0F3D5E">Level stand</text><text x="32" y="27">Rated for the filled weight, checked level</text></g>
<g transform="translate(468,432)"><circle cx="11" cy="11" r="11" fill="#12507C"/><text x="11" y="16" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">2</text><text x="32" y="10" font-size="14" font-weight="700" fill="#0F3D5E">Lid and LED light</text><text x="32" y="27">Lid limits jumping; use a timed light</text></g>
<g transform="translate(28,472)"><circle cx="11" cy="11" r="11" fill="#12507C"/><text x="11" y="16" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">3</text><text x="32" y="10" font-size="14" font-weight="700" fill="#0F3D5E">Filter</text><text x="32" y="27">Prime and submerge intake as instructed</text></g>
<g transform="translate(468,472)"><circle cx="11" cy="11" r="11" fill="#12507C"/><text x="11" y="16" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">4</text><text x="32" y="10" font-size="14" font-weight="700" fill="#0F3D5E">Heater + thermometer</text><text x="32" y="27">Never run dry; verify with a separate reading</text></g>
<g transform="translate(28,512)"><circle cx="11" cy="11" r="11" fill="#12507C"/><text x="11" y="16" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">5</text><text x="32" y="10" font-size="14" font-weight="700" fill="#0F3D5E">Substrate 2–3 in</text><text x="32" y="27">Rinsed until the water runs clear — no soap</text></g>
<g transform="translate(468,512)"><circle cx="11" cy="11" r="11" fill="#12507C"/><text x="11" y="16" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">6</text><text x="32" y="10" font-size="14" font-weight="700" fill="#0F3D5E">Plants and hiding places</text><text x="32" y="27">At least one cave, even for schooling fish</text></g>
<g transform="translate(28,552)"><circle cx="11" cy="11" r="11" fill="#12507C"/><text x="11" y="16" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">7</text><text x="32" y="10" font-size="14" font-weight="700" fill="#0F3D5E">Water line below the rim</text><text x="32" y="27">Leaves gas exchange space and room to work</text></g>
<g transform="translate(468,552)"><circle cx="11" cy="11" r="11" fill="#12507C"/><text x="11" y="16" font-size="12.5" font-weight="800" fill="#FFF" text-anchor="middle">8</text><text x="32" y="10" font-size="14" font-weight="700" fill="#0F3D5E">Drip loop on every cord</text><text x="32" y="27">Water runs to the loop, not into the socket</text></g>
</g>
</g>
</svg>
