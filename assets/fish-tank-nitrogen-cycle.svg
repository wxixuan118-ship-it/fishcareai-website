<text x="48" y="543" font-size="22" font-weight="700" fill="#185B47">Readiness check: test a measured ammonia input</text>
<text x="48" y="571" font-size="18" fill="#244D40">Both ammonia and nitrite must return to 0 ppm in your method’s test window.</text>
<text x="48" y="598" font-size="18" fill="#244D40">Nitrate alone is not proof. Plants, source water and water changes affect it.</text>
