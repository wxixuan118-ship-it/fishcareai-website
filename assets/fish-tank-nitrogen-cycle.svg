<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">The nitrogen cycle: what tests may show</title><desc id="desc">Illustrative curves, not measured data or a fixed schedule: ammonia rises and falls, nitrite peaks later and falls, and nitrate accumulates. Confirm processing of a measured ammonia input before stocking.</desc><rect width="900" height="650" rx="18" fill="#EFF7FD"/><path d="M18 0H882Q900 0 900 18V98H0V18Q0 0 18 0" fill="#12507C"/><g font-family="Segoe UI,Helvetica,Arial,sans-serif"><text x="32" y="44" font-size="29" font-weight="700" fill="white">The nitrogen cycle: what tests may show</text><text x="32" y="76" font-size="18" fill="#DAEEFF">Fishless cycling • illustrative trends, not measured data or a timetable</text>
