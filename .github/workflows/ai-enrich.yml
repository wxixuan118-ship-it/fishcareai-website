name: AI Fish Health Enrichment

on:
  schedule:
    # Daily at 02:00 UTC — runs automatically while pending rows remain
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max rows to process (leave empty = all pending)'
        required: false
        default: ''

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # glm-4-flash @ 0.6s/row × 3600 rows ≈ 36 min; 330 min safety margin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: data-pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r data-pipeline/requirements.txt

      - name: Run enrichment
        working-directory: data-pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "$LIMIT" ]; then
            python 11_fish_health_ai_enrich.py --limit "$LIMIT"
          else
            python 11_fish_health_ai_enrich.py
          fi
